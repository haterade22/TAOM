grade = "measured"
value = "Mirror error: model 01 neck 0.46 units at the median and 1.05 at the 95th percentile; v18ay neck 0.00 mm; v18ay head shell 0.92 mm at the median and 12.65 mm at the 95th percentile."
method = "the teardown record docs/knowledge/teardowns/2026-11-26-horse-armour-neck-and-head.md; the probe td_probe.py and its crest scripts are kept with the asset job, outside the repo"
