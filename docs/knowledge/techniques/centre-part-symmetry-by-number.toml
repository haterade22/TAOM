title = "Prove the symmetry of a centre-line part with a number"
line = "A part on the centre line is symmetric by construction (the larger of both sides on a field, the mean on a found feature), and its build report prints the mirror error."
why = "A part on the centre line reads as wrong when its halves differ, and a whole-view render does not show a few millimetres."
area = "asset-craft"
status = "active"
ask = "Which number proves the mirror symmetry of each centre-line part in this build?"
next = "Every centre-line part prints its mirror error and a gate holds a limit. The head shell's 12.65 mm at the 95th percentile has no known cause and is an open check."

[when]
outside = ["*rharmb_crinet*.py", "*rharmb_shell*.py", "*rharm*design*.py"]
tasks = ["armour symmetry", "centre line", "neck crest", "crest fin", "horse head armour"]

