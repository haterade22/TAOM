where = "envelope in rharmb_crinet.py and the height field of rharmb_shell.py; the same envelope (CR.envelope) is called by rharm2_neck23.py for the neck bands of armour 2"
scope = "called by armour 5 and, since v23, by the neck bands of armour 2: the stock plate builders (plate in rharmb_designs.py and rharm_designs.py) still call enforce_grid, so the old way is the default of armours 1 to 4 outside armour 2's neck"

