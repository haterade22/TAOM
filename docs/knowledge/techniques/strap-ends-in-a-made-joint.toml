title = "End every strap in a made joint at both ends"
line = "Every strap, band or rope ends in a made joint at both ends: a sewn lap on leather, a ring or buckle with a riveted tab on metal, under the rim at a helm or shell. No end in the air, and none on a stud."
why = "The session's reading: a part must look made and mounted, and an end that stops in the air or sits on a stud reads as floating. It was the maintainer's most repeated correction, and a link check by distance passed the builds in six marked pictures that he rejected on 2026-11-25: near is not connected."
area = "asset-craft"
status = "active"
ask = "Where does each strap end, at both ends? Name the joint for every end that this change adds or moves."
next = "A check that classes each strap end by the joint it lands on (a sewn lap, a ring or a riveted tab passes; a stud or bare air fails), printed in the build report and then failing the build. A check by distance does not do it."

