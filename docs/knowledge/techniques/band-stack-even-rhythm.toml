title = "Give a stack of bands one pitch and one tilt"
line = "Build the bands of a stack with equal length on one smooth field, each lapping the next by the same step. Target on the crest: a pitch spread of 0.05 or less."
why = "The eye reads equal spacing and an equal tilt as made, and a changing tilt as warped."
area = "asset-craft"
status = "active"
ask = "Where does this change show the crest pitch spread and the tilt of the band stack (a build report, or the manual run of td_crest_ours.py), and are they at or under the target?"
next = "The neck build's summary prints the crest pitch spread and the tilt, and a gate holds the limit. Today the spread comes from a manual run of td_crest_ours.py with the band island ids. The 0.05 target is the session's choice from the reference, not the maintainer's number."

