title = "Take ratios from a reference with a probe that logs its arguments"
line = "Scale a reference by one named landmark, measure ratios (bead to pitch, step to pitch, tilt) with a script kept beside the result, and let the script write its arguments into its output."
why = "A reference gives ratios, not lengths, and a number nobody can run again is a guess. A width in the build came from a picture probe whose columns were not logged and that could not be repeated."
area = "asset-craft"
status = "active"
next = "One general probe in tools/blender: sections, circle fits, pitch and mirror error, with its arguments written into its output."

[when]
outside = ["*/tripo_in/*", "*/tripo_refs/*", "*td_probe*.py"]
tasks = ["reference model", "reference probe", "teardown"]

