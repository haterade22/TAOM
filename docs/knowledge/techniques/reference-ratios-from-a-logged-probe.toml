value = "The picture probe of 2026-11-25 gave a bead of 0.2 of the pitch and could not be repeated; the two models give 0.147 and 0.167. Of the teardown's scripts only td_probe.py writes its arguments."
method = "the teardown record docs/knowledge/teardowns/2026-11-26-horse-armour-neck-and-head.md; the probe td_probe.py and its crest scripts are kept with the asset job, outside the repo"
date = 2026-11-26

[[acts]]
state = "instance"
where = "td_probe.py in the teardown folder of the asset job: it writes its arguments into its report"
