name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  check-build-config:
    name: Check Build Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Warn if BANNERLORD_GAME_DIR unset
        env:
          BANNERLORD_GAME_DIR: ${{ vars.BANNERLORD_GAME_DIR }}
        run: |
          if [ -z "$BANNERLORD_GAME_DIR" ]; then
            echo "::warning::BANNERLORD_GAME_DIR is not set — the Build & Test job will be skipped. Set this variable in repository settings to enable full CI."
          fi

  validate-xml:
    name: Validate XML & XSLT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate XML well-formedness
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Path "Main/_Module/ModuleData" -Filter "*.xml" -Recurse | ForEach-Object {
            try {
              [xml](Get-Content $_.FullName -Raw)
            } catch {
              Write-Error "Malformed XML: $($_.FullName) - $_"
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }
          Write-Host "All XML files are well-formed."

      - name: Validate XSLT well-formedness
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Path "Main/_Module/ModuleData" -Filter "*.xslt" -Recurse | ForEach-Object {
            try {
              [xml](Get-Content $_.FullName -Raw)
            } catch {
              Write-Error "Malformed XSLT: $($_.FullName) - $_"
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }
          Write-Host "All XSLT files are well-formed."

      - name: Validate JSON
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Path "Main/_Module/ModuleData" -Filter "*.json" -Recurse | ForEach-Object {
            try {
              Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
            } catch {
              Write-Error "Malformed JSON: $($_.FullName) - $_"
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }
          Write-Host "All JSON files are well-formed."

      - name: Validate native DLL links a static CRT
        shell: bash
        run: |
          # The vendored TAOM.NativeSkinFixes.dll must link a STATIC CRT
          # (Debug /MTd or Release /MT). A dynamic CRT (/MDd or /MD) imports
          # vcruntime*/msvcp140*/ucrtbase*/api-ms-win-crt* — DLLs players
          # without Visual Studio lack — so LoadLibrary fails with Win32
          # error 126 and NativeSkinFixes goes inert. pe_inspect.py is pure
          # stdlib and parses the PE import table cross-platform.
          DLL="Main/_Module/bin/Win64_Shipping_Client/TAOM.NativeSkinFixes.dll"
          if [ ! -f "$DLL" ]; then
            echo "::notice::$DLL not present — skipping static-CRT check."
            exit 0
          fi
          IMPORTS=$(python3 tools/pe_inspect.py "$DLL")
          echo "$IMPORTS"
          if echo "$IMPORTS" | grep -iqE 'VCRUNTIME|MSVCP[0-9]+|MSVCR[0-9]+|ucrtbase|api-ms-win-crt'; then
            echo "::error::$DLL links a DYNAMIC CRT (imports above). Players without Visual Studio get LoadLibrary error 126. Rebuild with a static CRT — Debug /MTd or Release /MT — via Dependencies/NativeSkinFixes.NativeHooks/Build.ps1."
            exit 1
          fi
          echo "Native DLL links a static CRT — no redistributable dependency."

  build:
    name: Build & Test
    runs-on: windows-latest
    # Requires Bannerlord game DLLs — runs on self-hosted runner or when BANNERLORD_GAME_DIR is set
    if: ${{ vars.BANNERLORD_GAME_DIR != '' || github.event_name == 'workflow_dispatch' }}
    env:
      BANNERLORD_GAME_DIR: ${{ vars.BANNERLORD_GAME_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TAOM.sln

      - name: Build
        run: dotnet build TAOM.sln -c Release --no-restore

      - name: Test
        run: dotnet test TAOM.Tests -c Release --no-build --verbosity normal
