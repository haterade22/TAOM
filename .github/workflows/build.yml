name: Build & Test

on:
  push:
    branches: [bannerlord-1.4.5]
  pull_request:
    branches: [bannerlord-1.4.5]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  check-build-config:
    name: Check Build Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Warn if BANNERLORD_GAME_DIR unset
        env:
          BANNERLORD_GAME_DIR: ${{ vars.BANNERLORD_GAME_DIR }}
        run: |
          if [ -z "$BANNERLORD_GAME_DIR" ]; then
            echo "::warning::BANNERLORD_GAME_DIR is not set, so Build and Test is skipped and NO C# is compiled by this run. Enabling it takes two steps, both outside this repo: register a self-hosted Windows runner on the machine that has Bannerlord installed (Settings, Actions, Runners), then set the repository variable BANNERLORD_GAME_DIR to that install path (Settings, Secrets and variables, Actions, Variables). The variable alone is not enough, because a GitHub-hosted runner has no game for it to point at."
          fi

  validate-xml:
    name: Validate XML & XSLT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate XML well-formedness
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Path "Main/_Module/ModuleData" -Filter "*.xml" -Recurse | ForEach-Object {
            try {
              [xml](Get-Content $_.FullName -Raw)
            } catch {
              Write-Error "Malformed XML: $($_.FullName) - $_"
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }
          Write-Host "All XML files are well-formed."

      - name: Validate XSLT well-formedness
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Path "Main/_Module/ModuleData" -Filter "*.xslt" -Recurse | ForEach-Object {
            try {
              [xml](Get-Content $_.FullName -Raw)
            } catch {
              Write-Error "Malformed XSLT: $($_.FullName) - $_"
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }
          Write-Host "All XSLT files are well-formed."

      - name: Validate JSON
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Path "Main/_Module/ModuleData" -Filter "*.json" -Recurse | ForEach-Object {
            try {
              Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
            } catch {
              Write-Error "Malformed JSON: $($_.FullName) - $_"
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }
          Write-Host "All JSON files are well-formed."

      - name: Validate native DLL links a static CRT
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # The vendored TAOM.NativeSkinFixes.dll must link a STATIC CRT
          # (Debug /MTd or Release /MT). A dynamic CRT (/MDd or /MD) imports
          # vcruntime*/msvcp140*/ucrtbase*/api-ms-win-crt* — DLLs players
          # without Visual Studio lack — so LoadLibrary fails with Win32
          # error 126 and NativeSkinFixes goes inert. pe_inspect.py is pure
          # stdlib and parses the PE import table cross-platform.
          DLL="Main/_Module/bin/Win64_Shipping_Client/TAOM.NativeSkinFixes.dll"
          if [ ! -f "$DLL" ]; then
            echo "::notice::$DLL not present — skipping static-CRT check."
            exit 0
          fi
          IMPORTS=$(python3 tools/pe_inspect.py "$DLL")
          echo "$IMPORTS"
          if echo "$IMPORTS" | grep -iqE 'VCRUNTIME|MSVCP[0-9]+|MSVCR[0-9]+|ucrtbase|api-ms-win-crt'; then
            echo "::error::$DLL links a DYNAMIC CRT (imports above). Players without Visual Studio get LoadLibrary error 126. Rebuild with a static CRT — Debug /MTd or Release /MT — via Dependencies/NativeSkinFixes.NativeHooks/Build.ps1."
            exit 1
          fi
          echo "Native DLL links a static CRT — no redistributable dependency."

      - name: Doc-graph ratchet (isolated docs must not grow)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # /doc-graph shipped 2026-06-08 and was then run by nothing: no hook, no
          # CI job. Ten weeks later isolated docs had gone 64 -> 153 and components
          # 70 -> 156, with every unit test green the whole time, because those
          # tests check the ALGORITHM against synthetic fixtures and never look at
          # the real docs/ tree. This is the check that speaks (#462 follow-up).
          #
          # Ratchets orphans and components only. Node/edge counts grow legitimately
          # with every doc that lands; an orphan (no inbound AND no outbound .md
          # link, so nothing will ever find it) is always a defect.
          #
          # Lowering the baseline is the goal: link isolates in, run
          # `python tools/check_doc_graph_ratchet.py --update`, commit the drop.
          python3 tools/check_doc_graph_ratchet.py

      - name: Modder handbook gates
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # docs/modding/ states what the engine reads off each XML element, and its readers
          # cannot check that themselves. Two read-only gates keep it true.
          #
          # lint_handbook.py needs nothing but the checkout: the chapter contract, dead links,
          # long dashes, drive paths, recipe trailers, live-path warnings.
          #
          # check_handbook_attributes.py normally diffs every attribute table against the
          # deserializer it cites, which needs the decompile dump. CI has no dump, so it falls
          # back to tools/handbook_attribute_manifest.json, the committed record of what each
          # cited method reads. That still catches the failure that matters here: a table row
          # added or renamed without re-deriving it from the engine. Refresh the manifest with
          # `python tools/check_handbook_attributes.py --update` on a machine that has the dump,
          # and commit it in the same change as the table.
          python3 tools/lint_handbook.py
          python3 tools/check_handbook_attributes.py


  hook-harness:
    name: Hook Harness Contract
    runs-on: ubuntu-latest
    # Its OWN job, deliberately. It first shipped as a step inside validate-xml,
    # positioned after the doc-graph ratchet, which has been failing since 2026-08-28.
    # GitHub Actions stops a job at the first failed step, so this gate never executed
    # once, and neither did the native-CRT check that then sat below it (silently
    # skipped since 2026-08-18). A gate that cannot run is not a gate: the exact
    # lesson this suite exists to enforce, reproduced by the commit that added it.
    #
    # The native-CRT check has since been reordered above the ratchet, so that
    # specific hole is closed. Every step in validate-xml now also carries
    # an always-run guard, so a future reordering cannot reopen it.
    steps:
      - uses: actions/checkout@v4

      - name: Hook harness contract test
        shell: bash
        run: |
          # Every Claude Code hook must terminate, exit 0 or 2, emit valid JSON if it is
          # a gate, carry an explicit timeout, and bound any external tool it runs BELOW
          # that timeout. On 2026-08-31 the hooks wedged for ~20 minutes per Bash call
          # (python3 resolving to a Store alias that never exits), and the repair pass
          # then silently killed two commit gates by sizing their timeouts against the
          # fast path. Both classes are mechanical; this is the check that speaks.
          #
          # HONEST LIMITATION: this runner is Linux, where `python3` is the correct
          # spelling and the Windows Store alias cannot exist. CI therefore catches
          # contract violations, hangs, missing timeouts and mis-sized inner bounds, but
          # NOT the Windows-specific alias trap itself. Check 1 of the script is a static
          # lint, so that part does carry over.
          bash tools/test_hooks.sh

  python-tests:
    name: Python Tool Tests
    runs-on: ubuntu-latest
    # Its OWN job, for the same reason hook-harness is one: a failure here must not
    # hide a gate living in another job.
    #
    # tools/tests holds several hundred tests and until now NOTHING ran them: not CI,
    # not a hook, not a skill, not build.ps1. That is the /doc-graph shape again
    # (shipped, then run by nothing, while the thing it guarded drifted).
    #
    # Every module is stdlib unittest, zero pytest imports, and each already does its
    # own sys.path insert. So this needs no pip install, no requirements.txt and no
    # conftest.py. Measured 2026-09-01 on a tree with no game install: the suite runs
    # headless in about 7 s and the 2 skips are the game-install tests, skipping
    # cleanly. No exact count is written here on purpose: a hardcoded total is the
    # shape that rots silently. The floor assertion below is the machine-checked part.
    steps:
      - uses: actions/checkout@v4

      - name: Run tools/tests
        shell: bash
        run: |
          # Capture rather than stream, so the floor check below can read the count.
          # unittest writes its summary to stderr.
          set +e
          OUT=$(python3 -m unittest discover -s tools/tests -t . 2>&1)
          RC=$?
          set -e
          echo "$OUT"

          # An empty discovery must not read as a pass. If the search root moves or a
          # collection error quietly drops modules, "Ran 0 tests" exits 0 and this job
          # goes green having verified nothing. That is the exact defect class this
          # suite exists to catch, so assert a floor instead of trusting the exit code.
          RAN=$(echo "$OUT" | grep -oE 'Ran [0-9]+ test' | tail -1 | awk '{print $2}')
          if [ -z "$RAN" ]; then
            echo "::error::unittest printed no summary line. Discovery did not complete, so this is not a pass."
            exit 1
          fi
          if [ "$RAN" -lt 700 ]; then
            echo "::error::Only $RAN tests discovered, expected at least 700. Collection is broken or the search root moved."
            exit 1
          fi
          echo "Discovered and ran $RAN tests."
          exit $RC

  build:
    name: Build & Test
    # SELF-HOSTED, and it has to be. Every project targets net472 and resolves the
    # engine through GameFolder/bin/Win64_Shipping_Client/TaleWorlds.*.dll HintPaths
    # (Directory.Build.props). A GitHub-hosted runner has no Bannerlord on it, so
    # GameBinariesFolder resolves empty and every one of those references breaks.
    # Setting vars.BANNERLORD_GAME_DIR on its own does NOT fix that: the variable is
    # only a path string, and aiming it at a path the runner does not have converts a
    # silent skip into a permanent red that cannot be fixed from the cloud.
    #
    # There is also no Microsoft.NETFramework.ReferenceAssemblies package anywhere in
    # this repo, so the net472 targeting pack comes from Visual Studio or Build Tools
    # on the machine. That is why no actions/setup-dotnet step appears below: it does
    # not supply those reference assemblies, and it can shadow the toolchain that
    # actually works.
    runs-on: [self-hosted, windows]
    #
    # Never on pull_request. This runner is a personal workstation, and contributor
    # branches live in this repo rather than in forks, so a PR-triggered run would
    # execute someone else's code on it. A push to the release branch and an explicit
    # workflow_dispatch are both owner-initiated; a pull_request is not.
    if: ${{ vars.BANNERLORD_GAME_DIR != '' && github.event_name != 'pull_request' }}
    env:
      BANNERLORD_GAME_DIR: ${{ vars.BANNERLORD_GAME_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore TAOM.sln

      # DisableModuleCopy and an empty ModuleId on BOTH build and test, and both flags
      # are needed together. Main/TAOM.csproj's CopyModule target deploys the built
      # module into GameFolder/Modules/ModuleId whenever ModuleId is non-empty and the
      # game folder exists. On a self-hosted runner that game folder is the developer's
      # real install, so without these a push would overwrite the module they are
      # playing, mid-session.
      - name: Build
        run: dotnet build TAOM.sln -c Release --no-restore -p:DisableModuleCopy=true -p:ModuleId=

      - name: Test
        run: dotnet test TAOM.Tests -c Release --no-build -p:DisableModuleCopy=true -p:ModuleId= --verbosity normal
