name: Python tool tests

# Runs tools/tests (stdlib unittest; several thousand tests) on the 1.5.x trunk. build.yml carries the
# same job for bannerlord-1.4.5 only, and until this file nothing ran these tests on 1.5.x: not CI, not
# a hook, not /verify (2026-09-29, docs/reviews/rca-mithrilforge-adoption-2026-09-29.md).
#
# Two things build.yml's copy lacked, which made its last runs error (run 35005853072, 2026-09-15):
#   * a Python new enough for Path.read_text(newline=...), which arrived in 3.13 (the dev machine runs
#     3.14, so this pins 3.14);
#   * the third-party packages tests import at module level. The list is every non-stdlib module a
#     test or a tool under test imports, minus the ones only Blender, Ghidra or the Claude API provide:
#     the tests needing those skip themselves. Measured 2026-09-29 in a clean venv with exactly this
#     list: 2,819 tests ran, none failed to import. Tests needing the game install skip here (no game
#     on the runner), so the local count of skips is lower than CI's.

on:
  push:
    branches: [bannerlord-1.5.x]
  pull_request:
    branches: [bannerlord-1.5.x]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python Tool Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest lxml lz4 xxhash numpy scipy capstone pefile pyyaml

      - name: Run tools/tests
        shell: bash
        run: |
          # Capture rather than stream, so the floor check below can read the count.
          # unittest writes its summary to stderr.
          set +e
          OUT=$(python -m unittest discover -s tools/tests -t . 2>&1)
          RC=$?
          set -e
          echo "$OUT"

          # An empty or truncated discovery must not read as a pass: "Ran 0 tests" exits 0.
          RAN=$(echo "$OUT" | grep -oE 'Ran [0-9]+ test' | tail -1 | awk '{print $2}')
          if [ -z "$RAN" ]; then
            echo "::error::unittest printed no summary line. Discovery did not complete, so this is not a pass."
            exit 1
          fi
          if [ "$RAN" -lt 2500 ]; then
            echo "::error::Only $RAN tests discovered, expected at least 2500. Collection is broken or the search root moved."
            exit 1
          fi
          echo "Discovered and ran $RAN tests."
          exit $RC
