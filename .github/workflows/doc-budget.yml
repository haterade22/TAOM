name: Doc budget

# The ADR-011 context budget and doc drift gate, on every branch. build.yml runs only for
# bannerlord-1.4.5 while the work lands on other branches, and until 2026-09-23 the CLAUDE.md
# budget lived only in a Claude PreToolUse hook, so commits made from the IDE or a terminal
# grew CLAUDE.md 20 KB past its cap unnoticed. This job checks every push and pull request,
# whoever made it.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-docs:
    name: Doc drift and context budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The linter is stdlib apart from this: PyYAML parses rule frontmatter, because a rule
      # whose frontmatter does not parse loads in every session and must count as unscoped.
      - name: PyYAML
        run: python -m pip install --quiet pyyaml

      - name: lint_docs.py --fail-on-drift
        shell: bash
        run: |
          # Fails on config-example drift, a Target line that disagrees with the pin, and the
          # context budget: CLAUDE.md with its imports, the trap index, the rules without paths:.
          python tools/lint_docs.py --fail-on-drift
