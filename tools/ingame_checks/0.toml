# the hot key ControlModeToggle, the controller's left pad down; game key 30 (CapsLock) is read by MissionMainAgentController.cs:811, which the
# shut controller already stops, so the patch on that control serves a player who mixes a gamepad with the Seat and its row presses left pad down.
[[human]]
claim = "from the Seat, pressing the drop and equip keys (game keys 13 and 22), the equip wheel key (34) and the cheer wheel key (31) does nothing: no weapon drops, no wheel opens, the hero does not cheer; a press under half a second made just before entering does not drop a weapon on the first tick after the Seat"

[[human]]
claim = "on a gamepad, or a gamepad mixed with the keyboard, left pad down from the Seat opens no walk mode control"

[[human]]
