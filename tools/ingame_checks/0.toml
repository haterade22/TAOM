  '\[MarshalsWord\] the thrower stand failed',
  '\[Check\] id=taom\.marshals-word\.throwers-stand result=fail',
  '\[PatchApply\] Patch_MissionTime_MarshalsWord (?:FAILED|SKIPPED)',
]
# Judged when a run ends, by a release or by the end of the Advance. A skip (reason=released-before-stand, with why= the release reason) means the run ended before the company stood: NOT REACHED.
# reason=closed-before-stand is a gap of 8 metres or less before the first stand (a company that starts within 12 metres of the enemy starts no run and writes no stand check), reason=walked-in is an overshoot past 6 metres, whether or not the company stood (one that walks through its point without stopping never stands), reason=fault is the postfix having thrown. A fail stops the stage (build-spec 9.4).
absence = "not-reached"

[[check]]
id = "taom.marshals-word.throwers-throw"
needs = "in a field battle, give an Advance to a company of javelin infantry in Line, at fire at will, with an enemy company ahead, and let them stand: the company looses at least ten javelins before it goes in"
reached = ['\[Check\] id=taom\.marshals-word\.throwers-throw result=(pass|fail)']
