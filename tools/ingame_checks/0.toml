[[human]]
claim = "the same key brings the view back to the hero: in third person with a short glide, from first person at once; the hero's controls work again at once"

[[human]]
claim = "in Fords of War, and with any other mod that owns the camera, the Seat does not enter and the log names the view that owns it ([SeatOfSeeing] another view owns the camera); in Fords, Q keeps its own camera turn"

[[human]]
claim = "the order panel opens from the Seat, and the order flag lands on the ground under the screen centre, also far from the hero"

[[human]]
claim = "the first press in a mission shows one message about the same key returning to the hero; the key does nothing during deployment and in photo mode"

# HandleUserInput keeps running: while the followed agent is the player's and game key 24 is down it raises _zoomAmount with any weapon
