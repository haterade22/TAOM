absence = "not-reached"

[[check]]
id = "taom.marshals-word.throwers-cost"
needs = "in a field battle, give an Advance to a company of javelin infantry in Line with an enemy company ahead and let the run end: the timer around the order position call saw at least 300 calls, with a mean under 50 microseconds and no call over 5 milliseconds"
reached = ['\[Check\] id=taom\.marshals-word\.throwers-cost result=(pass|fail)']
pass = ['\[Check\] id=taom\.marshals-word\.throwers-cost result=pass mission=[0-9]+ epoch=[0-9]+ calls=([3-9][0-9]{2}|[1-9][0-9]{3,}) mean_us=[0-9.]+ max_us=[0-9.]+$']
fail = [
  '\[Check\] id=taom\.marshals-word\.fault result=fail',
  '\[MarshalsWord\] the thrower stand failed',
  '\[Check\] id=taom\.marshals-word\.throwers-cost result=fail',
