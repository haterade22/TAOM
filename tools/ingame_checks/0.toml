fail = [
  '\[Check\] id=taom\.marshals-word\.fault result=fail',
  '\[Check\] id=taom\.marshals-word\.massed result=fail',
  '\[Swallowed\] feature=MarshalsWord site=MarshalWordComponent\.OnAIInputSet',
]
# This is the volley that followed a word the share rule gave, so it reads the same release window as volley-release and adds the eligible count and the draws left out as
# stale. A Massed word with fewer than five holding judges no window and writes a skip with reason=too-few-holding: NOT REACHED.
absence = "not-reached"

[[check]]
id = "taom.marshals-word.hold"
needs = "select a company and press Hold the Line (default Period): its soldiers stop attacking; a second press lets them fight again. A company under AI control is skipped with a reason"
reached = ['\[Check\] id=taom\.marshals-word\.hold result=pass']
pass = [
