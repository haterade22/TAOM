# In-game checks for the Seat of Seeing (stages S1 to S3) and Marshal's Word (stages M1 to M4, M3 without Massed), one draft manifest for both features because one held
# issue covers them (Seat contract, Deviations row 8). Read by tools/ingame_verdict.py. The Seat's lines come first; Marshal's Word's checks begin
# at the comment "Marshal's Word, stages M1" below.
#
# The Seat's part: All [Check] lines come from
# Client/Features/SeatOfSeeing/SeatSession.cs through IOutcomeLog, with the ids in
# Main/Features/SeatOfSeeing/Domain/SeatChecks.cs. Stages S2 and S3 add cursor (the first cursor of a mission), focus (the formation focus
# patch put the pointer in the handler's field), panel-reopened (keep the panel open reopened it, or the view model could not be reached),
# hide (the interface hidden, and restored with its reason) and keep and let-go (keeping to a soldier or a company, and letting go).
# A [PatchApply] line for a Patch140 class that failed or was skipped fails the enter check too: Harmony stops a category at its first failing
# class, so one such line is up to ten Seat patches off, and five of them are proved only by a press.
# Stage S1: enter and leave from the state changes (a refused key press writes an enter skip line,
# and a leave names its reason), frames once a Seat has owned 60 frames, glide when the return glide is armed (a fail line when the
# CameraElevation setter is missing, a skip line when there is no agent to follow), and fault when the latch fires. The hot-path counter
# taom.seat-of-seeing.owned-frame appears in the [Session] summary only.
#
# DRAFT: no GitHub issue yet, so the file is 0.toml with issue = 0. --issue 0 reads it, --owed never reaches it, and --post stops at gh. When the issue exists, rename to <issue>.toml and set issue.
issue = 0
title = "Seat of Seeing S1 to S3 and Marshal's Word M1 to M4: the camera lifts off the hero, points, keeps to a target and glides back, orders queue, companies keep the array, archers loose on the word, a company marks its target"
fixed_in = "7a4c4c00c"   # on trunk before the feature: the manifest ships with the emitter
logs = ["taom"]

[[check]]
id = "taom.seat-of-seeing.enter"
needs = "a field battle or custom battle: press the Seat key (Q unless rebound) once the deployment has ended, or turn on Begin Battles in the Seat"
reached = ['\[Check\] id=taom\.seat-of-seeing\.enter result=(pass|fail)']
pass = ['\[Check\] id=taom\.seat-of-seeing\.enter result=pass mission=[0-9]+ blend=[01]$']
fail = [
  '\[Check\] id=taom\.seat-of-seeing\.enter result=fail',
  '\[Check\] id=taom\.seat-of-seeing\.fault result=fail',
  '\[SeatOfSeeing\] the Seat could not start',
  '\[SeatOfSeeing\] hotkey registration failed',
  '\[SeatOfSeeing\] order ray failed',
  '\[PatchApply\] \S*Patch140_\S* (?:FAILED|SKIPPED)',
]
# A latched fault anywhere in the session fails the entry check too: the fault line must stay at zero, and so must the lines of the
# feature's own failures (the view could not start, the key could not register, the order ray threw, a Seat patch did not apply). A refused
# key press writes a skip line, which reads NOT REACHED with its reason.
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.frames"
needs = "stay in the Seat for at least a couple of seconds (60 owned frames)"
reached = ['\[Check\] id=taom\.seat-of-seeing\.enter result=pass']
pass = ['\[Check\] id=taom\.seat-of-seeing\.frames result=pass mission=[0-9]+ frames=60$']
fail = ['\[Check\] id=taom\.seat-of-seeing\.fault result=fail']
# The enter line without a frames line means the Seat was left, or the mission ended, inside 60 frames, which is a short visit and
# not a failure by itself. A fault line fails it.
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.leave"
needs = "press the Seat key again in a battle, or end the mission while in the Seat"
reached = ['\[Check\] id=taom\.seat-of-seeing\.leave result=']
pass = ['\[Check\] id=taom\.seat-of-seeing\.leave result=pass mission=[0-9]+ frames=[0-9]+ glide=[01] reason=(key|setting-off|interlude|rage|finish)$']
fail = ['\[Check\] id=taom\.seat-of-seeing\.fault result=fail']
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.glide"
needs = "leave the Seat with the key while the mission is in Battle mode and the hero is alive"
reached = ['\[Check\] id=taom\.seat-of-seeing\.glide result=(pass|fail)']
pass = ['\[Check\] id=taom\.seat-of-seeing\.glide result=pass mission=[0-9]+ elevation=set$']
fail = [
  '\[Check\] id=taom\.seat-of-seeing\.glide result=fail mission=[0-9]+ elevation=missing$',
  '\[Check\] id=taom\.seat-of-seeing\.fault result=fail',
]
# elevation=missing means MissionScreen.set_CameraElevation was not found (reflection-sites.md Category B). The glide still runs.
# Missing: `CameraElevation` keeps what `HandleUserInput` integrated from the mouse during the stay (MissionScreen:3051-3053,
# 3249-3251), so the glide's vertical angle starts from an unrelated value (4569), a visible jump. A skip line with reason=no-agent
# means the camera had no agent to follow (the hero had fallen): no glide runs, the look written on leaving stays, and this reads
# NOT REACHED.
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.cursor"
needs = "in the Seat with the order panel open and Show a cursor with the order panel on (it is by default): open the panel with its usual key"
reached = ['\[Check\] id=taom\.seat-of-seeing\.cursor result=pass']
pass = ['\[Check\] id=taom\.seat-of-seeing\.cursor result=pass mission=[0-9]+ cursor=shown$']
fail = ['\[Check\] id=taom\.seat-of-seeing\.fault result=fail']
# One line a mission, at the first show. Whether the cursor really draws, and where it stands after the middle-button look, is for a person.
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.focus"
needs = "in the Seat with the cursor shown over an enemy company: the formation focus patch has run once"
reached = ['\[Check\] id=taom\.seat-of-seeing\.cursor result=pass']
pass = ['\[Check\] id=taom\.seat-of-seeing\.focus result=pass mission=[0-9]+ focus=cursor$']
fail = ['\[Check\] id=taom\.seat-of-seeing\.fault result=fail']
# The line says the patch set the handler's reference point to the pointer. Which company a left release charges is for a person to see.
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.panel-reopened"
needs = "Keep the order panel open on, in the Seat: give an order from the panel and watch it open again"
reached = ['\[Check\] id=taom\.seat-of-seeing\.panel-reopened result=(pass|fail)']
pass = ['\[Check\] id=taom\.seat-of-seeing\.panel-reopened result=pass mission=[0-9]+ panel=reopened$']
fail = [
  '\[Check\] id=taom\.seat-of-seeing\.panel-reopened result=fail',
  '\[Check\] id=taom\.seat-of-seeing\.fault result=fail',
]
# result=fail with reason=site means GauntletOrderUIHandler._dataSource was not found (reflection-sites.md Category B): the panel stays closed.
# A reopen the engine refuses (OpenToggleOrder returns when the hero or the last troop is gone) writes result=skip with reason=refused, which
# reads NOT REACHED with that reason: the line is a pass only when Mission.IsOrderMenuOpen reads open after the call.
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.hide"
needs = "in the Seat press Hide the interface (End unless rebound), then open the order panel or leave the Seat"
reached = ['\[Check\] id=taom\.seat-of-seeing\.hide result=pass mission=[0-9]+ interface=hidden$']
pass = ['\[Check\] id=taom\.seat-of-seeing\.hide result=pass mission=[0-9]+ interface=restored reason=(key|panel|dialog|layer|leave|fault)$']
fail = ['\[Check\] id=taom\.seat-of-seeing\.fault result=fail']
# Hidden with no restored line is a fail: Cleanup restores the interface on every leave and fault, so the Seat's own hide cannot outlive the
# Seat, and only a crash or a kill during a hide leaves it unrestored, and a read while the Seat still holds a hide also reads FAIL (the crash has its own block beside it in the log). A named limit: the
# manifest pairs nothing per mission, so one mission that restores and a later one that does not still reads PASS; Cleanup restores on every
# exit but a crash, which is what makes that case unreachable here.
absence = "fail"

[[check]]
id = "taom.seat-of-seeing.keep"
needs = "in the Seat press Keep to this soldier or company (Insert unless rebound) with the pointer on a soldier, or with the order panel open and one company selected"
reached = ['\[Check\] id=taom\.seat-of-seeing\.keep result=pass']
pass = ['\[Check\] id=taom\.seat-of-seeing\.keep result=pass mission=[0-9]+ kind=(Soldier|Company)$']
fail = ['\[Check\] id=taom\.seat-of-seeing\.fault result=fail']
# A press that finds nobody writes a skip line with reason=nobody and one message; it reads as skipped, not as a failure.
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.let-go"
needs = "while keeping to a target, press the key again, fly with the movement keys, rise or sink, or let the target die"
reached = ['\[Check\] id=taom\.seat-of-seeing\.let-go result=pass']
pass = ['\[Check\] id=taom\.seat-of-seeing\.let-go result=pass mission=[0-9]+ reason=(key|flight|gone) kind=(Soldier|Company)$']
fail = ['\[Check\] id=taom\.seat-of-seeing\.fault result=fail']
# A let-go with reason=leave only says that the Seat was left with a target kept, which the key, flight and death routes (the three reasons
# above) do not prove, so it reads reached and not passed.
absence = "not-reached"

# ---- Marshal's Word, stages M1 (orders in turn) and M2 (keep the array) ----
# [Check] lines come from Client/Features/MarshalsWord/MarshalSession.cs and Main/Features/MarshalsWord/MarshalQueueDriver.cs and
# MarshalMarchDriver.cs through IOutcomeLog, with the ids in Main/Features/MarshalsWord/Domain/MarshalChecks.cs. The session's one fault
# line (taom.marshals-word.fault) has no check of its own: it is in every fail list and must stay at zero. A decline, a drop, a patience end
# and a session that never went live write skip lines, which read NOT REACHED with their reason. The exception is `started`: a capture
# that a direct order clears, that a drop removes, or that the end of the mission cuts off before its step starts reads FAIL, because no
# step started; behind a walk that window is the whole walk, so read the log's cleared, dropped and end=ImplicitArrival lines first. The
# manifest is shared with the Seat of Seeing, so a session of one feature alone exits 4 (the other feature's checks are NOT REACHED): read
# both with `--sessions 2`.

[[check]]
id = "taom.marshals-word.captured"
needs = "a field battle in single player: open the order panel, select a company, hold Left Shift (Give the order in turn) and give it a Move"
reached = ['\[Check\] id=taom\.marshals-word\.captured result=pass']
pass = ['\[Check\] id=taom\.marshals-word\.captured result=pass mission=[0-9]+ kind=\S+ companies=[0-9]+$']
fail = [
  '\[Check\] id=taom\.marshals-word\.fault result=fail',
  '\[MarshalsWord\] Marshal.s Word could not start',
  '\[MarshalsWord\] Marshal.s Word failed',
  '\[MarshalsWord\] the array layout failed',
  '\[MarshalsWord\] hotkey registration failed',
  '\[PatchApply\] (?:\S*Patch141_\S*|TAOM\.Features\.MarshalsWord\.\S+) (?:FAILED|SKIPPED)',
]
# A full queue needs twelve captures first, so its log already holds a pass line and this check passes. A session that never went live
# (Enable off, or a mission it does not run in) writes one skip line with reason=setting-off or reason=mission-refused: NOT REACHED, with that reason.
absence = "not-reached"

[[check]]
id = "taom.marshals-word.started"
needs = "after the capture, wait for the company to start the step (the driver passes four times a second of mission time). A capture cleared by a direct order, dropped, or cut off by the mission's end before its step starts also reads FAIL, and behind a walk that is the whole walk: read the log's cleared, dropped and end=ImplicitArrival lines first"
reached = ['\[Check\] id=taom\.marshals-word\.captured result=pass']
pass = ['\[Check\] id=taom\.marshals-word\.started result=pass mission=[0-9]+ end=(AtOnce|Arrival|TargetGone|EntityOrderEnded) companies=[0-9]+$']
fail = ['\[Check\] id=taom\.marshals-word\.fault result=fail']
# A captured step that never starts is the failure this check exists for, so it reads FAIL, not NOT REACHED, when a capture line exists.
# The pattern leaves out end=ImplicitArrival: that is the wait the driver puts ahead of a step behind a walk, and it starts even when the
# captured order is never issued. The line is keyed by mission and end kind, so it is the first start of each kind, not every step.

[[check]]
id = "taom.marshals-word.finished"
needs = "queue two Moves for one company (hold Left Shift for both): each step ends by arrival and the second starts after the first, which its line shows as behind=1"
reached = ['\[Check\] id=taom\.marshals-word\.finished result=pass']
pass = ['\[Check\] id=taom\.marshals-word\.finished result=pass mission=[0-9]+ reason=arrival end=Arrival company=[0-9]+ behind=1$']
fail = [
  '\[Check\] id=taom\.marshals-word\.fault result=fail',
  '\[Check\] id=taom\.marshals-word\.patience result=fail',
]
# The check passes on one reason=arrival line of a Move with behind=1 (build-spec 5.6). behind=1 says the last member of the Move ahead of this
# step arrived while this step had not started: it is the chain this row exists to prove. A lone Move writes behind=0, and so do a step behind an instant,
# dropped or timed-out step, a step behind a Move that one member arrived at and another did not, and the end=ImplicitArrival wait the driver puts ahead of a step behind a walk, so any number of
# lone Moves reads NOT REACHED. A step that ends by patience writes a skip line with reason=patience and a number, and the patience check
# fails once it ended more than one step in four after eight finished steps. TargetGone and EntityOrderEnded
# need a kill or a siege, so they have no check; their pass lines show the reason when a battle reaches them.
absence = "not-reached"

[[check]]
id = "taom.marshals-word.patience"
needs = "eight or more finished steps in one mission (a battle with several queued Moves)"
reached = ['\[Check\] id=taom\.marshals-word\.finished result=pass']
pass = ['\[Check\] id=taom\.marshals-word\.patience result=pass mission=[0-9]+ finished=8 by-patience=[0-9]+$']
fail = [
  '\[Check\] id=taom\.marshals-word\.fault result=fail',
  '\[Check\] id=taom\.marshals-word\.patience result=fail',
]
absence = "not-reached"

[[check]]
id = "taom.marshals-word.cleared"
needs = "queue a Move for a company, then give it a direct Move without the queue key"
reached = ['\[Check\] id=taom\.marshals-word\.captured result=pass']
pass = ['\[Check\] id=taom\.marshals-word\.cleared result=pass mission=[0-9]+ company=[0-9]+ steps=[0-9]+$']
fail = ['\[Check\] id=taom\.marshals-word\.fault result=fail']
absence = "not-reached"

[[check]]
id = "taom.marshals-word.declined"
needs = "give an order with the queue key held and no company selected, or in Deployment, or to a company under AI control"
reached = ['\[Check\] id=taom\.marshals-word\.declined result=skip']
pass = ['\[Check\] id=taom\.marshals-word\.declined result=skip mission=[0-9]+ reason=(none-selected|not-allowed|deployment|ai-controlled)$']
fail = ['\[Check\] id=taom\.marshals-word\.fault result=fail']
# The decline path is judged by its line: it must name its reason, and vanilla runs the order at once.
absence = "not-reached"

[[check]]
id = "taom.marshals-word.array"
needs = "select two or more companies and, with the order panel open, click once and drag once on the ground (Keep the Array on)"
reached = ['\[Check\] id=taom\.marshals-word\.array result=(pass|fail)']
pass = [
  '\[Check\] id=taom\.marshals-word\.array result=pass mission=[0-9]+ kind=click companies=[0-9]+$',
  '\[Check\] id=taom\.marshals-word\.array result=pass mission=[0-9]+ kind=drag companies=[0-9]+$',
]
fail = [
  '\[Check\] id=taom\.marshals-word\.fault result=fail',
  '\[Check\] id=taom\.marshals-word\.array result=fail',
]
# A fail line means the layout threw, latched itself off for the mission, and vanilla laid out every later order.
absence = "not-reached"

[[check]]
id = "taom.marshals-word.march"
needs = "order two or more selected companies with a drag, with Arrive Together on"
reached = ['\[Check\] id=taom\.marshals-word\.array result=pass']
pass = ['\[Check\] id=taom\.marshals-word\.march result=pass mission=[0-9]+ companies=[0-9]+$']
fail = ['\[Check\] id=taom\.marshals-word\.fault result=fail']
absence = "not-reached"

[[check]]
id = "taom.marshals-word.march-spread"
needs = "order two companies in Line at clearly different distances (about 2.5:1, for example 100 m and 40 m) with one drag, with Arrive Together on, and let the march run to its end without giving them another order; a far walk that takes under 15 s to the slack at its speed writes no-test, so riders, and anything above 6 m/s, need longer walks than that example"
reached = ['\[Check\] id=taom\.marshals-word\.march-spread result=(pass|fail)']
pass = ['\[Check\] id=taom\.marshals-word\.march-spread result=pass mission=[0-9]+ spread=[0-9.]+ longest=[0-9.]+ shortest=[0-9.]+$']
fail = [
  '\[Check\] id=taom\.marshals-word\.fault result=fail',
  '\[Check\] id=taom\.marshals-word\.march-spread result=fail',
]
# longest and shortest are the first pass's longest and shortest time to the 3 m arrival slack, in seconds, and spread is the gap between the
# first and the last company to come within it. Passes when the spread is within 2 s + a quarter of longest, plus what no pace can remove
# (a company at the 0.3 floor still arrives early when its walk is very short). It proves the pace only when the longest takes at least 15 s
# and the walks differ by more than 1.4 times that allowance, because a Line company can beat a tidy first read by at most 1.25 and a far company at
# 1.1 with a near company at 1 needs 1.4 on the walks swept: anything closer also passes without any pace, so the march writes a skip line with reason=no-test (spread, longest and shortest in the
# line) and this reads NOT REACHED. The proof cannot separate a far company further above its read than the near one, or a company in Shield Wall,
# Square or Circle that runs untidy, so this row is for companies in Line. A working pace can FAIL when a near company reads up to about 1.5 m/s on a walk up to about 18 m, or when a far company under
# its first read meets a near company over it, by about 1.37 between them: read shortest, the walk and the speeds before you blame the pace.
# A march whose companies changed between two passes writes reason=company-left with no verdict, because the spread and the walks it was
# proved on no longer name the same companies. A march ended by a later order, an emptied company, its patience, a reading that is not a number, a replacement, the setting or a
# change of the player's team writes a skip line with its reason (reordered, emptied, patience, invalid, replaced, setting-off, team-changed):
# also NOT REACHED. This row cannot
# judge a march whose near company stopped short of the slack: it counts as arriving at the end of the march, however long ago it stopped.
absence = "not-reached"

# Stages M3 and M4. The archers' lines come from MarshalFireDriver.cs and the mark lines from MarshalQueueDriver.cs and MarshalMarkWatch.cs,
# through IOutcomeLog, with the ids in MarshalChecks.cs. The plain [Marshal] lines (word, fire, mark) are the evidence a person reads; the
# check lines are the verdicts. Stage M3 is built with Massed held back: key 543 cycles free and on-word only.

[[check]]
id = "taom.marshals-word.fire"
needs = "select a company of archers and press Change the Archers' Fire (default Comma): it goes to on-word, and a second press returns it to free. A company under AI control is skipped with a reason"
reached = ['\[Check\] id=taom\.marshals-word\.fire result=pass']
pass = [
  '\[Check\] id=taom\.marshals-word\.fire result=pass mission=[0-9]+ mode=OnWord company=[0-9]+$',
  '\[Check\] id=taom\.marshals-word\.fire result=pass mission=[0-9]+ mode=Free company=[0-9]+$',
]
fail = ['\[Check\] id=taom\.marshals-word\.fault result=fail']
# The check needs both modes, so one press alone (the way into the on-word mode) reads NOT REACHED: a second press must bring the company back to free.
absence = "not-reached"

[[check]]
id = "taom.marshals-word.word"
needs = "put a company of archers on the word, wait until some hold a drawn bow, and press Give the Word (default M). A company on free or under AI control is skipped with a reason"
reached = ['\[Check\] id=taom\.marshals-word\.fire result=pass']
pass = ['\[Check\] id=taom\.marshals-word\.word result=pass mission=[0-9]+ company=[0-9]+ holding=([5-9]|[1-9][0-9]+)$']
fail = ['\[Check\] id=taom\.marshals-word\.fault result=fail']
# A word given with fewer than five holding judges no release window (MarshalTuning.VolleyMinHolding), so it proves nothing about the release: NOT REACHED.
absence = "not-reached"

[[check]]
id = "taom.marshals-word.volley-hold"
needs = "archers on the word with an enemy in range, left for five seconds with no word while at least five of them hold a drawn bow: at most one shot in twenty of the holding may leave"
reached = ['\[Check\] id=taom\.marshals-word\.volley-hold result=(pass|fail)']
pass = ['\[Check\] id=taom\.marshals-word\.volley-hold result=pass mission=[0-9]+ company=[0-9]+ holding=[0-9]+ shots=[0-9]+$']
fail = [
  '\[Check\] id=taom\.marshals-word\.fault result=fail',
  '\[Check\] id=taom\.marshals-word\.volley-hold result=fail',
]
# holding is the smallest count of the window and shots counts the arrows that left while a soldier held. A fail means the bow did not stay drawn:
# the stage stops there (build-spec 7), and the cause is one of the three native beliefs of 7.1. Fewer than five holding judges nothing: NOT REACHED.
absence = "not-reached"

[[check]]
id = "taom.marshals-word.volley-release"
needs = "after the hold check, press Give the Word with at least five archers holding: at least 70 percent of them loose within 1.3 seconds"
reached = ['\[Check\] id=taom\.marshals-word\.volley-release result=(pass|fail)']
pass = ['\[Check\] id=taom\.marshals-word\.volley-release result=pass mission=[0-9]+ company=[0-9]+ holding=[0-9]+ shots=[0-9]+$']
fail = [
  '\[Check\] id=taom\.marshals-word\.fault result=fail',
  '\[Check\] id=taom\.marshals-word\.volley-release result=fail',
]
# shots counts the arrows that left in the two seconds after a release, from the word to the end of the window (the pass runs four times a
# second of mission time, so a shot up to a quarter second late can still count). A word with fewer than five holding judges nothing.
absence = "not-reached"

[[check]]
id = "taom.marshals-word.mark"
needs = "select a company, open the order panel, hold Mark, Do Not Move (default Left Ctrl) and order a charge on an enemy company: the company keeps its movement order and takes the enemy as its target"
reached = ['\[Check\] id=taom\.marshals-word\.mark result=(pass|skip)']
pass = ['\[Check\] id=taom\.marshals-word\.mark result=pass mission=[0-9]+ companies=[0-9]+$']
fail = ['\[Check\] id=taom\.marshals-word\.fault result=fail']
# A skip line (reason=not-applied) means no selected company took the mark at the next tick; a click that finds no company under the player's control is
# declined with a reason on the declined check and runs as a charge.
absence = "not-reached"

[[check]]
id = "taom.marshals-word.mark-effect"
needs = "mark an enemy company for a ranged company on Stop, and leave the mark for at least three seconds with at least three soldiers that have a target: at least half of those aim at the marked company"
reached = ['\[Check\] id=taom\.marshals-word\.mark result=pass']
pass = ['\[Check\] id=taom\.marshals-word\.mark-effect result=pass mission=[0-9]+ company=[0-9]+ target=[0-9]+ context=RangedOnStop onTarget=[0-9]+ of=[0-9]+$']
fail = [
  '\[Check\] id=taom\.marshals-word\.fault result=fail',
  '\[Check\] id=taom\.marshals-word\.mark-effect result=fail',
]
# One battle reaches this row: the field trial's mark_keeps_order step marks an enemy company for the archers on Stop. Only that case is judged. A melee
# company on a Move read onTarget=1 of=20 (run 20261104-185456) and is not judged any more: soldiers in hand to hand choose their own foe (build-spec
# Deviations row 19). A company on Charge, Advance or ChargeToTarget holds a target vanilla gave it and is neither sampled nor logged. A company with any
# other order, or fewer than three soldiers with a target, is logged on the [Marshal] mark line and not judged. A fail stops the stage (build-spec 8.1).
absence = "not-reached"

[[human]]
claim = "the view rises over about 0.7 seconds, then flies with WASD, Space and Z (game keys 14 and 15, rebindable) for up and down, the wheel for height and the mouse to look; the hero takes no movement or combat input"

[[human]]
claim = "the same key brings the view back to the hero: in third person with a short glide, from first person at once; the hero's controls work again at once"

[[human]]
claim = "in Fords of War, and with any other mod that owns the camera, pressing the Seat key does not enter the Seat and the log then names the view that owns it ([SeatOfSeeing] another view owns the camera; Marshal's Word asks the same question when a mission starts, so that line can also appear with no press); in Fords, Q keeps its own camera turn"

[[human]]
claim = "the order panel opens from the Seat, and the order flag lands on the ground under the screen centre, also far from the hero"

[[human]]
claim = "the first press in a mission shows one message about the same key returning to the hero; the key does nothing during deployment and in photo mode"

# HandleUserInput keeps running: while the followed agent is the player's and game key 24 is down it raises _zoomAmount with any weapon
# on keyboard and mouse (a gamepad needs a ranged weapon out) and writes depth of field (3074-3078, 3119-3142, 3298-3303), and key 24
# is the Seat's fast key. The Seat writes the two depth of field calls back every frame, so the view stays sharp.
