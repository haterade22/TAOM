[[check]]
id = "taom.marshals-word.throwers-stand"
needs = "in a field battle, give an Advance to a company of javelin infantry in Line, at fire at will, with an enemy company ahead: the company stops short of the enemy at a gap of 24 to 32 metres and does not walk past the point it was sent to by more than 6 metres"
reached = ['\[Check\] id=taom\.marshals-word\.throwers-stand result=(pass|fail)']
pass = ['\[Check\] id=taom\.marshals-word\.throwers-stand result=pass mission=[0-9]+ company=[0-9]+ gap_at_stand=[0-9.]+ stand_gap=[0-9.]+ overshoot=[0-9.]+$']
