  '\[MarshalsWord\] the thrower stand failed',
  '\[Check\] id=taom\.marshals-word\.throwers-throw result=fail',
  '\[PatchApply\] Patch_MissionTime_MarshalsWord (?:FAILED|SKIPPED)',
]
# Judged at the release. shots counts the company's shots from its first stand to the release, whatever its fire mode; throws on the approach or after the release do not count. A fail (reason=few-throws) needs ten seconds stood: the soldiers stood and did not throw.
# A skip (reason=never-stood or reason=short-stand) is NOT REACHED. The scoring that should make the soldiers throw is a decompile read, so a fail here is the finding that stops the stage (build-spec 9.4).
absence = "not-reached"

[[check]]
id = "taom.marshals-word.throwers-melee"
needs = "after a company of javelin infantry has thrown and released (most have thrown, the enemy came close or forty seconds stood), still under the Advance: within 45 seconds the company goes at least 3 metres toward the enemy and its blows rise"
reached = ['\[Check\] id=taom\.marshals-word\.throwers-melee result=(pass|fail)']
pass = ['\[Check\] id=taom\.marshals-word\.throwers-melee result=pass mission=[0-9]+ company=[0-9]+ blows=[1-9][0-9]* melee_s=[0-9.]+ advanced_m=[0-9.]+$']
