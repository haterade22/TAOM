# In-game checks for the Seat of Seeing (stages S1 to S3), read by tools/ingame_verdict.py. All [Check] lines come from
# Client/Features/SeatOfSeeing/SeatSession.cs through IOutcomeLog, with the ids in
# Main/Features/SeatOfSeeing/Domain/SeatChecks.cs. Stages S2 and S3 add cursor (the first cursor of a mission), focus (the formation focus
# patch put the pointer in the handler's field), panel-reopened (keep the panel open reopened it, or the view model could not be reached),
# hide (the interface hidden, and restored with its reason) and keep and let-go (keeping to a soldier or a company, and letting go).
# A [PatchApply] line for a Patch140 class that failed or was skipped fails the enter check too: Harmony stops a category at its first failing
# class, so one such line is up to ten Seat patches off, and five of them are proved only by a press.
# Stage S1: enter and leave from the state changes (a refused key press writes an enter skip line,
# and a leave names its reason), frames once a Seat has owned 60 frames, glide when the return glide is armed (a fail line when the
# CameraElevation setter is missing, a skip line when there is no agent to follow), and fault when the latch fires. The hot-path counter
# taom.seat-of-seeing.owned-frame appears in the [Session] summary only.
#
# DRAFT: no GitHub issue yet, so the file is 0.toml with issue = 0. --issue 0 reads it, --owed never reaches it, and --post stops at gh. When the issue exists, rename to <issue>.toml and set issue.
issue = 0
title = "Seat of Seeing S1 to S3: the camera lifts off the hero, points, keeps to a soldier or a company, and glides back"
fixed_in = "7a4c4c00c"   # on trunk before the feature: the manifest ships with the emitter
logs = ["taom"]

[[check]]
id = "taom.seat-of-seeing.enter"
needs = "a field battle or custom battle: press the Seat key (Q unless rebound) once the deployment has ended, or turn on Begin Battles in the Seat"
reached = ['\[Check\] id=taom\.seat-of-seeing\.enter result=(pass|fail)']
pass = ['\[Check\] id=taom\.seat-of-seeing\.enter result=pass mission=[0-9]+ blend=[01]$']
fail = [
  '\[Check\] id=taom\.seat-of-seeing\.enter result=fail',
  '\[Check\] id=taom\.seat-of-seeing\.fault result=fail',
  '\[SeatOfSeeing\] the Seat could not start',
  '\[SeatOfSeeing\] hotkey registration failed',
  '\[SeatOfSeeing\] order ray failed',
  '\[PatchApply\] \S*Patch140_\S* (?:FAILED|SKIPPED)',
]
# A latched fault anywhere in the session fails the entry check too: the fault line must stay at zero, and so must the lines of the
# feature's own failures (the view could not start, the key could not register, the order ray threw, a Seat patch did not apply). A refused
# key press writes a skip line, which reads NOT REACHED with its reason.
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.frames"
needs = "stay in the Seat for at least a couple of seconds (60 owned frames)"
reached = ['\[Check\] id=taom\.seat-of-seeing\.enter result=pass']
pass = ['\[Check\] id=taom\.seat-of-seeing\.frames result=pass mission=[0-9]+ frames=60$']
fail = ['\[Check\] id=taom\.seat-of-seeing\.fault result=fail']
# The enter line without a frames line means the Seat was left, or the mission ended, inside 60 frames, which is a short visit and
# not a failure by itself. A fault line fails it.
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.leave"
needs = "press the Seat key again in a battle, or end the mission while in the Seat"
reached = ['\[Check\] id=taom\.seat-of-seeing\.leave result=']
pass = ['\[Check\] id=taom\.seat-of-seeing\.leave result=pass mission=[0-9]+ frames=[0-9]+ glide=[01] reason=(key|setting-off|interlude|rage|finish)$']
fail = ['\[Check\] id=taom\.seat-of-seeing\.fault result=fail']
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.glide"
needs = "leave the Seat with the key while the mission is in Battle mode and the hero is alive"
reached = ['\[Check\] id=taom\.seat-of-seeing\.glide result=(pass|fail)']
pass = ['\[Check\] id=taom\.seat-of-seeing\.glide result=pass mission=[0-9]+ elevation=set$']
fail = [
  '\[Check\] id=taom\.seat-of-seeing\.glide result=fail mission=[0-9]+ elevation=missing$',
  '\[Check\] id=taom\.seat-of-seeing\.fault result=fail',
]
# elevation=missing means MissionScreen.set_CameraElevation was not found (reflection-sites.md Category B). The glide still runs.
# Missing: `CameraElevation` keeps what `HandleUserInput` integrated from the mouse during the stay (MissionScreen:3051-3053,
# 3249-3251), so the glide's vertical angle starts from an unrelated value (4569), a visible jump. A skip line with reason=no-agent
# means the camera had no agent to follow (the hero had fallen): no glide runs, the look written on leaving stays, and this reads
# NOT REACHED.
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.cursor"
needs = "in the Seat with the order panel open and Show a cursor with the order panel on (it is by default): open the panel with its usual key"
reached = ['\[Check\] id=taom\.seat-of-seeing\.cursor result=pass']
pass = ['\[Check\] id=taom\.seat-of-seeing\.cursor result=pass mission=[0-9]+ cursor=shown$']
fail = ['\[Check\] id=taom\.seat-of-seeing\.fault result=fail']
# One line a mission, at the first show. Whether the cursor really draws, and where it stands after the middle-button look, is for a person.
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.focus"
needs = "in the Seat with the cursor shown over an enemy company: the formation focus patch has run once"
reached = ['\[Check\] id=taom\.seat-of-seeing\.cursor result=pass']
pass = ['\[Check\] id=taom\.seat-of-seeing\.focus result=pass mission=[0-9]+ focus=cursor$']
fail = ['\[Check\] id=taom\.seat-of-seeing\.fault result=fail']
# The line says the patch set the handler's reference point to the pointer. Which company a left release charges is for a person to see.
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.panel-reopened"
needs = "Keep the order panel open on, in the Seat: give an order from the panel and watch it open again"
reached = ['\[Check\] id=taom\.seat-of-seeing\.panel-reopened result=(pass|fail)']
pass = ['\[Check\] id=taom\.seat-of-seeing\.panel-reopened result=pass mission=[0-9]+ panel=reopened$']
fail = [
  '\[Check\] id=taom\.seat-of-seeing\.panel-reopened result=fail',
  '\[Check\] id=taom\.seat-of-seeing\.fault result=fail',
]
# result=fail with reason=site means GauntletOrderUIHandler._dataSource was not found (reflection-sites.md Category B): the panel stays closed.
# A reopen the engine refuses (OpenToggleOrder returns when the hero or the last troop is gone) writes result=skip with reason=refused, which
# reads NOT REACHED with that reason: the line is a pass only when Mission.IsOrderMenuOpen reads open after the call.
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.hide"
needs = "in the Seat press Hide the interface (End unless rebound), then open the order panel or leave the Seat"
reached = ['\[Check\] id=taom\.seat-of-seeing\.hide result=pass mission=[0-9]+ interface=hidden$']
pass = ['\[Check\] id=taom\.seat-of-seeing\.hide result=pass mission=[0-9]+ interface=restored reason=(key|panel|dialog|layer|leave|fault)$']
fail = ['\[Check\] id=taom\.seat-of-seeing\.fault result=fail']
# Hidden with no restored line is a fail: Cleanup restores the interface on every leave and fault, so the Seat's own hide cannot outlive the
# Seat, and only a crash or a kill during a hide leaves it unrestored, and a read while the Seat still holds a hide also reads FAIL (the crash has its own block beside it in the log). A named limit: the
# manifest pairs nothing per mission, so one mission that restores and a later one that does not still reads PASS; Cleanup restores on every
# exit but a crash, which is what makes that case unreachable here.
absence = "fail"

[[check]]
id = "taom.seat-of-seeing.keep"
needs = "in the Seat press Keep to this soldier or company (Insert unless rebound) with the pointer on a soldier, or with the order panel open and one company selected"
reached = ['\[Check\] id=taom\.seat-of-seeing\.keep result=pass']
pass = ['\[Check\] id=taom\.seat-of-seeing\.keep result=pass mission=[0-9]+ kind=(Soldier|Company)$']
fail = ['\[Check\] id=taom\.seat-of-seeing\.fault result=fail']
# A press that finds nobody writes a skip line with reason=nobody and one message; it reads as skipped, not as a failure.
absence = "not-reached"

[[check]]
id = "taom.seat-of-seeing.let-go"
needs = "while keeping to a target, press the key again, fly with the movement keys, rise or sink, or let the target die"
reached = ['\[Check\] id=taom\.seat-of-seeing\.let-go result=pass']
pass = ['\[Check\] id=taom\.seat-of-seeing\.let-go result=pass mission=[0-9]+ reason=(key|flight|gone) kind=(Soldier|Company)$']
fail = ['\[Check\] id=taom\.seat-of-seeing\.fault result=fail']
# A let-go with reason=leave only says that the Seat was left with a target kept, which the key, flight and death routes (the three reasons
# above) do not prove, so it reads reached and not passed.
absence = "not-reached"

[[human]]
