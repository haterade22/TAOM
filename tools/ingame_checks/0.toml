[[check]]
id = "taom.marshals-word.massed"
needs = "put a company of archers on Massed fire (press Change the Archers' Fire twice, default Comma) with an enemy in range: when at least 70 percent of the archers who can still shoot hold a drawn bow, the word is given for them, and at least 70 percent of the holders loose within 1.3 seconds"
