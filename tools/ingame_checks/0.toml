[[check]]
id = "taom.marshals-word.hold-line"
needs = "hold the line on a company of foot soldiers that fights beside a company that does not hold: from 3 seconds after the press, for 10 seconds, the soldiers of the line deal at most one blow in ten of the other company's, which must deal at least 10, and at least 5 held soldiers read the attack flag off. A soldier of the held company who is not in the line (no shield, or an order that is not a hold) is not counted against it, and every soldier of the other company counts"
reached = ['\[Check\] id=taom\.marshals-word\.hold-line result=(pass|fail)']
pass = ['\[Check\] id=taom\.marshals-word\.hold-line result=pass mission=[0-9]+ company=[0-9]+ flagOff=[0-9]+ blows=[0-9]+ control=[0-9]+ controlBlows=[0-9]+ seconds=[0-9.]+$']
fail = [
  '\[Check\] id=taom\.marshals-word\.fault result=fail',
  '\[Check\] id=taom\.marshals-word\.hold-line result=fail',
]
# The soldiers who qualify are shielded foot soldiers in the shield wall, circle or square under an order that is not a charge; a wounded soldier's blows inside the strike back window count as hold-strike's, not as the held company's.
# The first control is the busiest company that is not on hold by the blows of the mission, chosen when the baseline is taken. A control that dealt under ten blows (reason=no-control) takes a new baseline and the window stays open,
# and the next control is the company, other than that one, that dealt the most blows in the window just judged (the busiest of the mission again when none did), so a later busy window writes the verdict (the skip is written once, and a later pass line makes the row PASS); a flag that read on for the held soldiers (reason=flag-not-off) writes a skip too: NOT REACHED.
# A fail stops the stage (build-spec 9.2): the flag does not stop the AI that already holds a target.
absence = "not-reached"

[[check]]
id = "taom.marshals-word.hold-slot"
needs = "hold the line on a company of foot soldiers in the shield wall, circle or square under Stop, with enemies pressing and at least one soldier wounded: in each five second window with at least five steered reads, no more of the soldiers the clamp steered end a read farther from the place they held when the order was given than nearer to it"
reached = ['\[Check\] id=taom\.marshals-word\.hold-slot result=(pass|fail)']
pass = ['\[Check\] id=taom\.marshals-word\.hold-slot result=pass mission=[0-9]+ company=[0-9]+ qualified=([5-9]|[1-9][0-9]+) far=[0-9]+ order=Stop steered=([5-9]|[1-9][0-9]+) closer=[0-9]+ farther=[0-9]+$']
fail = [
  '\[Check\] id=taom\.marshals-word\.fault result=fail',
  '\[Check\] id=taom\.marshals-word\.hold-slot result=fail',
  '\[Swallowed\] feature=MarshalsWord site=MarshalWordComponent\.OnAIInputSet',
]
# Judged every five seconds from the driver's count of the line, and only under Stop, where the slot is an anchor the soldier's own place set (a Move gives a moving slot the check does not judge).
# It waits for five qualified soldiers, at least half of whom read an anchor, for a wound, and for five steered reads in the window, because a line that nobody presses stays in place whatever the steering does: NOT REACHED until then.
# The [Marshal] slot line carries the order beside the distances, so a zero under Stop does not read as a pass. A fail stops the clamp (build-spec 9.2): the AI's input is in another frame, or replacing it moves soldiers away.
# The [Marshal] slot line ends with closer=, farther=, steered= and loose=: over its five seconds, the steered soldiers whose next hold read ended nearer their slot than the distance at their first replaced tick, those who ended farther, all steered reads
# (a soldier in his strike back window is left out), and the reads beyond the slack of a soldier in the line that no replaced tick preceded. The check line carries the window's steered=, closer= and farther=, the numbers it judged, and a fail shows closer below farther.
# far= and max= are facts: a crowd, a press or an input the clamp leaves alone moves soldiers, and the clamp walks back no soldier who was pushed away. A slot line is also written, with no verdict, when the hold goes off,
# when the company goes to the AI, when the player's team changes and when the mission ends.
absence = "not-reached"

[[check]]
id = "taom.marshals-word.hold-strike"
