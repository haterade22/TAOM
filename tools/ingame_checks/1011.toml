# In-game checks for #1011, read by tools/ingame_verdict.py. Both [Check] lines come from
# Main/Features/HeroRace/RacePersistenceService.cs: taom.race-persist.capture from CaptureHeroRacesForSave
# (OnBeforeSaveEvent, one line per save), taom.race-persist.restore at the end of RestoreHeroRaces
# (OnSessionLaunched, one line per load, after a read-back of every race the restore expects). The legend
# warning is the existing LogWarning in RestoreHeroRaces. A save in one session and its load in the next is a
# two-session check: run the reader with --sessions 2.
#
# The posthumous-son half of the issue has no check line: the template call runs before the son exists and
# cannot fail (a son copies his father's race), so it is a [[human]] item below.
issue = 1011
title = "Dead heroes keep their race across save and load"
fixed_in = "f981629cd"   # the fix the issue's closing comment names
logs = ["taom"]

[[check]]
id = "taom.race-persist.capture"
needs = "save a running campaign (any TAOM campaign has a dead hero from day 0)"
reached = ['\[Check\] id=taom\.race-persist\.capture result=pass ']
pass = ['\[Check\] id=taom\.race-persist\.capture result=pass heroes=[0-9]+ dead=[1-9][0-9]*$']
fail = ['\[Check\] id=taom\.race-persist\.capture result=fail']
# Every TAOM campaign starts with a dead hero (lord_E6_2, alive="false" in characters/heroes.xml), so a pass
# line with dead=0 means the roster lost its dead heroes, the #1011 regression. The reader reports it as
# NOT REACHED with the line shown; read it as a failure, not as a save that needs a hero to die first.
absence = "not-reached"

[[check]]
id = "taom.race-persist.restore"
needs = "on a build with the fix: change a hero's race (for example the player's child), let them die, save, then load that save"
reached = ['\[Check\] id=taom\.race-persist\.restore result=pass ']
pass = ['\[Check\] id=taom\.race-persist\.restore result=pass restored=[0-9]+ dead_restored=[1-9][0-9]* wraiths=[0-9]+ skipped=[0-9]+ mismatch=0 saved=[0-9]+$']
fail = [
  '\[Check\] id=taom\.race-persist\.restore result=fail',
  '\[WARNING\] RacePersistenceService: saved race -?[0-9]+ for hero \S+ is outside the save',
]
# A load where no dead hero needed restoring proves nothing. A new campaign, and a save older than
# RacePersistenceBehavior (the engine gives it no SyncData), write result=skip with reason=new-campaign or
# reason=no-record; the reader prints the reason because the reached pattern matches pass lines only.
absence = "not-reached"

[[human]]
claim = "after the load, the dead hero's encyclopedia page shows the race you gave them, and the Race filter lists them under it"

[[human]]
claim = "on a build with the fix, a father dies; save and load; his son born after that shows the father's race in the encyclopedia (a father who died on an older build keeps the reverted race)"

[[human]]
claim = "co-op: after a client loads a save that restores races, its Coop_client.log has no line 'Client updated managed BasicCharacterObject.Race' (the reader cannot pass on a missing line)"
