# In-game checks for #1337 (The Long Defeat: buy Aragorn, Legolas and Gimli at the shop), read by tools/ingame_verdict.py. The [Check] lines come from
# Main/Features/LongDefeat/LongDefeatDirector.Heroes.cs and Diagnostics/LongDefeatHeroChecks.cs.
# hero, key <mission>h<N> for the mission's Nth hero spawn, is written on the tick after the buy. It passes when the body the engine made is a hero to it (is_hero=1 campaign=0; a line from before #1366 has no campaign=), has no mount
# (mounted=0), stands in the heroes' formation (formation=7) and has its health limit scaled by the shop's factor (health_factor= equals wanted_factor=). The formation
# must also be off AI control after the spawn (held=1), so the siege tactic cannot move him out, and hold no soldier who is not a held hero (strangers=0). order= names the
# formation's movement order: Move when the spawn gave the standing order at a wall lane, or whatever order the player gave group 8. wielded= names the item in his hand (the bow,
# for Legolas). A spawn the field refused fails with problem=, and the gold is paid back.
# hero-fall, key <mission><hero>-f<N>, is written when a held hero leaves the field, with cause=killed or cause=fled; the shop sells him again.
# hunters, key <mission>hw<wave>, is written at each wave clear of a mission that spawned a hero: standing=, in_group= (in formation 7), units= (the soldiers the formation holds),
# held= (1 when it is off AI control), order= (its movement order), own= (1 while that order is still the field's own Move to the wall lane), settled= (the whole seconds since the field gave it, 0 under
# another order), near= (the standing heroes within 20 m of that place on the ground and 4 m in height), kills= (the engine's KillCount, which counts knock-outs too), health= per hero, and the mission's running totals of the director's holds: retaken=, moved_out=,
# moved_back=. It passes only when every hero is in formation 7, units equals in_group, held=1, and, once the field's own order has stood 60 seconds (own=1, settled 60 or more), near
# equals standing. A player's own order (own=0) and heroes still on their way (settled below 60) are never judged on near; kills and the totals are never judged; with no
# hero standing it is skipped.
# The unattended proof is a run with gold to spare, so the bot buys the heroes once no pack fits: run_long_defeat.py owes a pass line for each hero purchase in the report, and
# a hunters pass or skip once the run cleared a wave a hero was bought before.
issue = 1337
title = "The Long Defeat: buy Aragorn, Legolas and Gimli at the shop"
# fixed_in is the branch base, which holds none of these lines, so a build before the feature reads NOT REACHED.
fixed_in = "aa67e8ed4"
logs = ["taom"]

[[check]]
id = "taom.long-defeat.hero"
needs = "a Long Defeat intermission in which the bot or the player buys a hero: python tools/run_long_defeat.py --waves 3 --garrison-scale 1.3 --start-gold 5000"
reached = ['\[Check\] id=taom\.long-defeat\.hero result=']
pass = ['\[Check\] id=taom\.long-defeat\.hero result=pass hero=\S+ troop=taom_hero_\S+ is_hero=1 (?:campaign=0 )?mounted=0 formation=7 held=1 strangers=0 order=\S+ health_factor=[0-9.]+ wanted_factor=[0-9.]+ wielded=\S+$']
fail = ['\[Check\] id=taom\.long-defeat\.hero result=fail']
absence = "not-reached"

[[check]]
id = "taom.long-defeat.hero-fall"
needs = "a run in which a bought hero falls or flees; a run in which every hero lives writes no line"
reached = ['\[Check\] id=taom\.long-defeat\.hero-fall result=']
pass = ['\[Check\] id=taom\.long-defeat\.hero-fall result=pass hero=\S+ cause=(killed|fled)$']
fail = ['\[Check\] id=taom\.long-defeat\.hero-fall result=fail']
absence = "not-reached"

[[check]]
id = "taom.long-defeat.hunters"
needs = "a Long Defeat run in which a bought hero stands at a wave clear: python tools/run_long_defeat.py --waves 3 --garrison-scale 1.3 --start-gold 5000; one line per cleared wave, w= is the wave"
reached = ['\[Check\] id=taom\.long-defeat\.hunters result=']
pass = ['\[Check\] id=taom\.long-defeat\.hunters result=pass w=[0-9]+ standing=([0-9]+) in_group=\1 units=\1 held=1 order=\S+ (?:own=0 settled=[0-9]+ near=[0-9]+|own=1 settled=[0-5]?[0-9] near=[0-9]+|own=1 settled=(?:[6-9][0-9]|[0-9]{3,}) near=\1) kills=[0-9]+ by=\S+ health=\S+ retaken=[0-9]+ moved_out=[0-9]+ moved_back=[0-9]+$']
fail = ['\[Check\] id=taom\.long-defeat\.hunters result=fail']
absence = "not-reached"

[[human]]
claim = "after the bot or the player buys the three heroes, they walk to the wall as group 8 and fight there; order key 8 selects them as one group, they obey a move and a charge order, and the siege AI neither merges them into another formation nor leaves them idle"

[[human]]
claim = "Legolas spawns with his bow in hand and shoots; Aragorn and Gimli fight on foot with the sword and the two-handed axe; none of the three has a horse"

[[human]]
claim = "a hero who falls in a wave can be bought again in the next calm, and a second hero line follows the second buy"
