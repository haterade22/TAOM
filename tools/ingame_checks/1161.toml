# In-game checks for #1161 (The Long Defeat: upgrade the soldiers you already have in the shop), read by tools/ingame_verdict.py. The [Check] line comes from
# Main/Features/LongDefeat/LongDefeatDirector.Upgrades.cs and Diagnostics/LongDefeatUpgradeChecks.cs, key <mission>u<N> for the mission's Nth upgrade order, written on the tick after the buy. It
# passes when every soldier of the old troop the field found, up to the order's count, was replaced by an active new soldier, and every new soldier stood within 1 m of the old one's place;
# found= falls short of ordered= when a soldier died between the buy and the tick, and his gold is paid back. An order that found nobody is a skip with reason=none-found. problem= names a
# target troop the game does not know, or no defender team; a spawn that throws ends the run on a fault and writes no upgrade line.
# The unattended proof is a run with gold to spare, so the bot buys a step after its packs and fortifications: run_long_defeat.py owes a pass line for each upgrade purchase in the report, with
# its wave, step and count.
# fixed_in is the groundwork commit, which holds the check; a build without the shop.json steps (before the follow-up commit) sells none, writes no line and reads NOT REACHED.
issue = 1161
title = "The Long Defeat: upgrade the soldiers you already have in the shop"
fixed_in = "313400cff"   # the groundwork (merged to trunk in e6bdcbeec); the Rohan steps and the shop rows land in the follow-up commit
logs = ["taom"]

[[check]]
id = "taom.long-defeat.upgrade"
needs = "a Long Defeat intermission in which the player or the bot buys an upgrade step: python tools/run_long_defeat.py --waves 2 --garrison-scale 1.3 --start-gold 5000, or a player who buys a row under Upgrade your soldiers"
reached = ['\[Check\] id=taom\.long-defeat\.upgrade result=']
pass = ['\[Check\] id=taom\.long-defeat\.upgrade result=pass w=[0-9]+ from=\S+ to=\S+ ordered=[1-9][0-9]* found=[0-9]+ replaced=[1-9][0-9]* read=[1-9][0-9]*']
fail = ['\[Check\] id=taom\.long-defeat\.upgrade result=fail']
# An order that found nobody (none-found) is a skip and shows nothing either way.
absence = "not-reached"

[[human]]
claim = "in the shop, under Upgrade your soldiers, a row shows for each step whose troop has a soldier standing, with how many stand and how many the gold pays for; a row the gold does not reach is grey"

[[human]]
claim = "after buying an upgrade row, each upgraded soldier changes to the new troop's armour and weapons where he stood, facing the same way and in the same formation, with no jump, and his health bar keeps its share"

[[human]]
claim = "an upgrade bought while the opening split holds: the upgraded soldiers stand with their group at the wall or gate, and the log shows [LongDefeat][Split] an upgrade:"

[[human]]
claim = "a King's Knights pack on foot upgraded to the King's Royal Guard, and then to the Riders of Rohan, stays on foot on the wall: no horse appears"
