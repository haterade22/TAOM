# In-game check for #1370 (the free heroes' formation in the Helm's Deep story mission: the garrison's Infantry formation is moved into the heroes' formation and out again by the repair
# during the preparation before the first wave), read by tools/ingame_verdict.py. The issue is OPEN and no fix is in the tree: this row is the check that is red on the bug.
# The defect is read from the hunters line, the #1337 wave-clear line: its moved_out= is the running total of every soldier the heroes' repair took out of the heroes' group in the
# whole run, so a repair after the lord's fall counts too. Run 20261116-075342 reads moved_out=1517 and run 20261116-081024 reads moved_out=1481. The row judges moved_out only: a hunters line of
# either result passes it with moved_out=0 and fails it with moved_out above 0. The other fields belong to tools/ingame_checks/1366.toml.
# The row reads one segment: from the launch of helms_deep_defend (StoryMissionLauncher's "[StoryMissions] launching <scene> for '<id>' (...)") to the next launch of any story mission or
# Long Defeat run, as tools/ingame_checks/1366.toml scopes its rows. Read the verdict from a game process that fought no other battle after the story mission.
issue = 1370
title = "Story missions: the free heroes' formation takes no soldier of the garrison"
# fixed_in names the trunk commit this manifest was written on; a fix commit replaces it, and only a build that holds it counts. The docs commit of the feature sets it (the main session does that).
fixed_in = "a4cedd4c2"
logs = ["taom"]

[[check]]
id = "taom.story-missions.hosted.hunters"
scope = '\[StoryMissions\] launching \S+ for \x27helms_deep_defend\x27 '
scope_end = '\[(LongDefeat|StoryMissions)\] launching '
needs = "the story mission of #1366 with a wave cleared while a free hero stands (unattended: python tools/run_scenario.py --kind story-mission --mission helms_deep_defend); the hunters line reads moved_out=0"
reached = ['\[Check\] id=taom\.story-missions\.hosted\.hunters result=']
pass = ['\[Check\] id=taom\.story-missions\.hosted\.hunters result=(?:pass|fail) w=[0-9]+ .* moved_out=0 moved_back=[0-9]+$']
fail = ['\[Check\] id=taom\.story-missions\.hosted\.hunters result=(?:pass|fail) w=[0-9]+ .* moved_out=[1-9][0-9]* moved_back=[0-9]+$']
absence = "not-reached"
