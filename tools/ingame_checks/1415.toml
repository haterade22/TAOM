# In-game checks for #1415 (Legolas keeps out of melee range and uses his sword when cornered), read by tools/ingame_verdict.py.
# The line comes from Main/Features/HeroAbilities/Hooks/HeroRangedMissionLogic.cs at the mission end (verdict in HeroRangedChecks,
# the step in HeroKeepDistance), keyed hr<N>-<characterId>-<k> as the #1361 lines are.
# keep-distance: steps= the engine calls that sent him away from an enemy within keepDistanceMeters (hero_abilities.json);
# moved= the steps his body walked (half the step or more along it when the 2.5 s hold ended), so a pass proves the engine moved
# him, not only that the call ran; cornered= the times such an enemy stood near him and no point was usable (no direction away,
# off the navmesh, outside the boundary, another level, or a walking path over twice the step); each look, a step or a cornered
# one, starts the 3 s cooldown. melee_seconds= the one-second samples with a melee weapon in his hand.
# It passes with one move; with no move, ten steps or ten cornered looks fail; else it skips (no-threat, few-threats, or off when
# either value is 0). melee_seconds is not judged: it shows that he draws the sword. The look of the step is a person's to check.
# Only Long Defeat launches are judged: the Helm's Deep story mission writes the same line, but this manifest does not read it.
# The unattended proof: python tools/run_long_defeat.py --waves 3 --garrison-scale 1.3 --start-gold 5000, so the bot buys the heroes.
issue = 1415
title = "Legolas keeps out of melee range and uses his sword when cornered"
# fixed_in is the feature commit: only a build that holds it counts.
fixed_in = "8dafcadf7"
logs = ["taom"]

[[check]]
id = "taom.hero-abilities.keep-distance"
scope = '\[LongDefeat\] launching \S+ for fortress '
scope_end = '\[(LongDefeat|StoryMissions)\] launching '
needs = "a Long Defeat run in which the bot buys Legolas and an attacker comes within 5 m of him on his level"
reached = ['\[Check\] id=taom\.hero-abilities\.keep-distance result=(pass|fail)']
pass = ['\[Check\] id=taom\.hero-abilities\.keep-distance result=pass hero=\S+ steps=[1-9][0-9]* moved=[1-9][0-9]* cornered=[0-9]+ melee_seconds=[0-9]+$']
fail = ['\[Check\] id=taom\.hero-abilities\.keep-distance result=fail', '\[HeroAbilities\] ranged kit disabled for this mission after ', '\[HeroAbilities\] disabled for this mission after ']
absence = "not-reached"

[[human]]
claim = "When attackers reach the heroes' wall lane, Legolas backs off a few steps, turns and shoots again, and does not walk off the wall or down a stair"

[[human]]
claim = "With no room to step back, Legolas draws his sword (the Mirkwood Legolas Sword) and fights, then takes his bow again once the enemy is gone"
