[[check]]
id = "taom.long-defeat.gate-level"
needs = "a Long Defeat run in which the gate is reinforced: python tools/run_long_defeat.py --waves 3 --garrison-scale 1.3 --start-gold 5000 (the bot buys gate level 1 at clear 1 and level 2 at clear 2; the report lists them as gateLevel purchases)"
reached = ['\[Check\] id=taom\.long-defeat\.gate-level result=']
pass = ['\[Check\] id=taom\.long-defeat\.gate-level result=pass l=[0-9]+ factor=[0-9.]+ gates=[0-9]+ (g[0-9]+\.)?max=[0-9.]+/[0-9.]+ (g[0-9]+\.)?hp=']
fail = ['\[Check\] id=taom\.long-defeat\.gate-level result=fail']
# Written by LongDefeatDirector.Gates.cs, key l<N> (the level reached), on the tick after the buy, once the adapter has written every visible gate (D18): each gate's maximum is its vanilla maximum (read at the boot before any hit, 15000 at Helm's Deep) times
# the level's factor within 1% (max=actual/wanted), a standing gate's share of hit points held within 0.1% (share=before->after: the write is HP * newMax / oldMax less one hit point, so a level never heals the missing share and a broken gate stays at 0), and the damage-state index the
# next hit computes did not fall (index=before->after, E9b: a next hit that computes index 0 on a gate stored at 1 or more reads state -1 and throws; a level keeps the index from falling at all). A level bought where no gate stands fails (gates=0).
absence = "not-reached"

