# In-game checks for #1079 (The Long Defeat), read by tools/ingame_verdict.py. Every [Check] line comes from
# Main/Features/LongDefeat/LongDefeatDirector*.cs and LongDefeatChecks.cs, and the client rows (orders, hud) from LongDefeatHudView.cs, with their
# ids and verdicts in LongDefeatClientChecks.cs; the ids are const strings there. A row lands with its emitter. The unattended judge, tools/run_long_defeat.py, holds a
# run to its REQUIRED_CHECKS list; this manifest is what ingame_verdict reads across sessions.
#
# fixed_in is the commit the runs were built from, so a .dirty build reads NOT REACHED.
issue = 1079
title = "The Long Defeat: a wave survival mode on siege maps"
fixed_in = "c075c92f0"   # the build of the three clean 5-wave runs and the lose run
logs = ["taom"]

[[check]]
id = "taom.long-defeat.boot"
needs = "start a Long Defeat run (autorun, or taom.ld_start helms)"
reached = ['\[Check\] id=taom\.long-defeat\.boot result=']
pass = ['\[Check\] id=taom\.long-defeat\.boot result=pass deployment_finished=true siege_ai=true main=true friendly=false']
fail = ['\[Check\] id=taom\.long-defeat\.boot result=fail']
# Deployment finished, siege team AI, a main agent and IsFriendlyMission false (Tab and the order bar depend on it). A boot that could
# not host the run writes the fail line itself. The mission-start rows below (general, muster, keep) are reached once the boot line
# passed, so a mission that booted and never wrote its own row is a FAIL, not NOT REACHED.
absence = "fail"

[[check]]
id = "taom.long-defeat.general"
needs = "the same run"
reached = ['\[Check\] id=taom\.long-defeat\.boot result=pass']
pass = ['\[Check\] id=taom\.long-defeat\.general result=pass general_is_main=true player_general=true order_owner_is_main=true']
fail = ['\[Check\] id=taom\.long-defeat\.general result=fail']
absence = "fail"

[[check]]
id = "taom.long-defeat.muster"
needs = "the same run: the garrison musters in timed batches"
reached = ['\[Check\] id=taom\.long-defeat\.boot result=pass']
pass = ['\[Check\] id=taom\.long-defeat\.muster result=pass ']
fail = ['\[Check\] id=taom\.long-defeat\.muster result=fail']
# Per batch: no soldier far or off the navmesh, on_point at most half the batch (floor 6), overlap at most 6. The overlap radius of 0.4 m is a first guess (risk 17),
# so a fail here is a thing to read in the [LongDefeat][Muster] lines before it is a bug.
absence = "fail"

[[check]]
id = "taom.long-defeat.keep"
needs = "the same run"
reached = ['\[Check\] id=taom\.long-defeat\.boot result=pass']
pass = ['\[Check\] id=taom\.long-defeat\.keep result=pass source=(scene|recorded) at=\(']
fail = ['\[Check\] id=taom\.long-defeat\.keep result=fail']
absence = "fail"

[[check]]
id = "taom.long-defeat.orders"
needs = "the same run, once the HUD view has seen the main agent"
reached = ['\[Check\] id=taom\.long-defeat\.boot result=pass']
pass = ['\[Check\] id=taom\.long-defeat\.orders result=pass sets=[1-9]']
fail = ['\[Check\] id=taom\.long-defeat\.orders result=fail']
# Client: VisualOrderFactory.GetOrders().Count > 0. Zero means IsFriendlyMission is still true or no provider is registered. A booted
# mission whose view never wrote the line (it faulted, or never saw the agent) is a FAIL.
absence = "fail"

[[check]]
id = "taom.long-defeat.hud"
needs = "the same run"
reached = ['\[Check\] id=taom\.long-defeat\.boot result=pass']
pass = ['\[Check\] id=taom\.long-defeat\.hud result=pass movie=LongDefeatHud wave_text=set']
fail = ['\[Check\] id=taom\.long-defeat\.hud result=fail']
# Client (LongDefeatClientChecks.cs): both movies report IsLoaded (the panel is loaded and released once at mission start) and the view
# model's WaveText is set. A missing prefab raises no exception, so a false IsLoaded is the only sign. A panel that fails to load later
# latches the view off and writes this id's fail line. A screenshot of the panel is the human row below.
absence = "fail"

[[check]]
id = "taom.long-defeat.wave"
needs = "clear five waves"
reached = ['\[Check\] id=taom\.long-defeat\.wave result=']
pass = ['\[Check\] id=taom\.long-defeat\.wave result=pass kills=[0-9]+ felled=[0-9]+ ']
fail = ['\[Check\] id=taom\.long-defeat\.wave result=fail']
min = 5
# One line per cleared wave. A wave fails when more than the straggler share of it (its roster plus its summons) was felled by the stalemate rule instead of killed.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.stale"
needs = "a wave that stalls and is charged"
reached = ['\[Check\] id=taom\.long-defeat\.stale result=']
pass = ['\[Check\] id=taom\.long-defeat\.stale result=pass cleared=true']
fail = ['\[Check\] id=taom\.long-defeat\.stale result=fail']
# A stalled wave is not guaranteed, so a session with none is NOT REACHED. Only a run that ended as a stalemate after a charge fails it; a loss on the last few defenders skips it and names who stood.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.no-rout"
needs = "a run with kills"
reached = ['\[Check\] id=taom\.long-defeat\.no-rout result=']
pass = ['\[Check\] id=taom\.long-defeat\.no-rout result=pass fled=0 fleeing_peak=0 ']
fail = ['\[Check\] id=taom\.long-defeat\.no-rout result=fail']
# The morale clause holds every attacker at morale 0.01, so none may flee. A run with no kills writes a skip line and reads NOT REACHED.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.gold"
needs = "a run that ends"
reached = ['\[Check\] id=taom\.long-defeat\.gold result=']
pass = ['\[Check\] id=taom\.long-defeat\.gold result=pass start=']
fail = ['\[Check\] id=taom\.long-defeat\.gold result=fail']
# Start plus earned minus spent is the balance, a kill owes a bounty and a cleared wave owes its bonus.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.shop"
needs = "a run in which the shop bot (or a person) buys a pack"
reached = ['\[Check\] id=taom\.long-defeat\.shop result=']
pass = ['\[Check\] id=taom\.long-defeat\.shop result=pass spawned=[0-9]+ of=[0-9]+ ']
fail = ['\[Check\] id=taom\.long-defeat\.shop result=fail']
# The pack must come back at its full count. on_point and overlap are detail only and fail nothing.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.early-start"
needs = "a run in which the horn sounds with time left in a phase"
reached = ['\[Check\] id=taom\.long-defeat\.early-start result=']
pass = ['\[Check\] id=taom\.long-defeat\.early-start result=pass paid=[0-9]+ expected=[0-9]+ ']
fail = ['\[Check\] id=taom\.long-defeat\.early-start result=fail']
absence = "not-reached"

[[check]]
id = "taom.long-defeat.player-death"
needs = "a run in which the player's agent dies and is replaced"
reached = ['\[Check\] id=taom\.long-defeat\.player-death result=']
pass = ['\[Check\] id=taom\.long-defeat\.player-death result=pass via=(respawn|takeover)']
fail = ['\[Check\] id=taom\.long-defeat\.player-death result=fail']
# The unattended run's main agent may never die, so a session with no death is NOT REACHED.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.end"
needs = "a run that ends"
reached = ['\[Check\] id=taom\.long-defeat\.end result=']
pass = ['\[Check\] id=taom\.long-defeat\.end result=pass reason=[A-Za-z]+ wave=[0-9]+ cleared=[0-9]+ kills=[0-9]+ report=built']
fail = ['\[Check\] id=taom\.long-defeat\.end result=fail']
# A mission fault writes this id's fail line, so a faulted run reads FAIL.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.best-run"
needs = "a run that ends (every exit saves its run, a 0-wave loss included)"
reached = ['\[Check\] id=taom\.long-defeat\.best-run result=']
pass = ['\[Check\] id=taom\.long-defeat\.best-run result=pass waves=[0-9]+ kills=[0-9]+ read_back=same']
fail = ['\[Check\] id=taom\.long-defeat\.best-run result=fail']
absence = "not-reached"

[[check]]
id = "taom.long-defeat.menu"
needs = "the main menu drawn once (any session that reaches it, with no autorun needed)"
reached = ['\[Check\] id=taom\.long-defeat\.menu result=']
pass = ['\[Check\] id=taom\.long-defeat\.menu result=pass fortresses=[1-9]']
fail = ['\[Check\] id=taom\.long-defeat\.menu result=fail']
# Written by LongDefeatMenuEntry the first time the menu asks whether the option is hidden. A config with no fortress hides it and fails;
# a dedicated server hides it on purpose and writes a skip line, which reads NOT REACHED. The click-through itself is the prompt-text human row.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.scale"
needs = "a wave past the authored list, and for a tier step a wave 13 or later (--start-wave 12 --waves 2)"
reached = ['\[Check\] id=taom\.long-defeat\.scale result=']
pass = ['\[Check\] id=taom\.long-defeat\.scale result=pass w=[0-9]+ health=']
fail = ['\[Check\] id=taom\.long-defeat\.scale result=fail']
# Written once per wave past the authored list, at its clear (or at the run's end inside it), key w=<N>. A standing attacker's health limit over its
# character maximum equals the wave's health factor within 1%, read at spawn and again late in the wave (the engine may undo a write); its troop is
# one of the wave's tier-stepped mix; a damage factor above 1 raised at least one blow (amplified=); and the engine's standing count never passed the room the previous tick spawned into (over_room=0).
# An authored wave writes nothing, so a session that never passed wave 10 reads NOT REACHED. A run that ended before the wave's first batch closed writes nothing either.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.affix"
needs = "a wave that carries affixes (wave 5 or later: --start-wave 5 --waves 1 --seed N)"
reached = ['\[Check\] id=taom\.long-defeat\.affix result=']
pass = ['\[Check\] id=taom\.long-defeat\.affix result=pass w=[0-9]+ count=[0-9]+ scheduled=[0-9]+ powers=']
fail = ['\[Check\] id=taom\.long-defeat\.affix result=fail']
# Written by LongDefeatDirector.Affixes.cs when a wave that rolls affixes starts, key w=<N>: as many powers as the schedule gives the wave (0 before wave 5, 1 from 5, 2 from 10, 3 from 15), each a known power,
# none twice, and each named in the attacker culture's table of affixes.json. A wave with none writes nothing, so a session that never reached wave 5 reads NOT REACHED.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.affix-effect"
needs = "a wave whose roll holds a power with an effect check (--start-wave 5 --waves 1 --seed N): at wave 5 seed 0 rolls eye, 1 hide, 2 lash, 3 blades (a hit must land on a defender), 5 discipline, 7 terror (the wave must run a few seconds), 9 hammer, 15 drums"
reached = ['\[Check\] id=taom\.long-defeat\.affix-effect result=']
pass = ['\[Check\] id=taom\.long-defeat\.affix-effect result=pass power=[a-z]+ ']
fail = ['\[Check\] id=taom\.long-defeat\.affix-effect result=fail']
# One line per stat power or hide in the wave, key power=<id>, written when the wave's first batch has closed (LongDefeatDirector.Affixes.cs); hammer and terror write their own line under the same id and key (LongDefeatDirector.Powers.cs and .Blades.cs, below). One standing human attacker with no live race ability is read
# through the effects adapter: each driven property the power changes against the stat model's own answer for the same agent with the affixes left out, within 1% (armour against the spawn equipment's sums, since
# the engine writes it once at spawn). A sample that could not show the effect (an unarmoured soldier) writes a skip line, which reads NOT REACHED. No standing plain attacker (none human, active, not fleeing and free of a live race ability) writes a fail line, reason=no-sample, so a FAIL can mean that no plain attacker stood.
# hammer: written when the wave starts, after the engines' hit points were set, as power=hammer engines=<n> want=<factor> got=<kind>=<ratio>,.. gate=<standing|destroyed|none> (the gates are read from every mission object, since a destroyed gate leaves the active list, Mission.cs:3060); every live ram and tower must hold the vanilla hit points of its type
# (SiegeEngineType.BaseHitPoints) times the factor within 1%, the gate's state is logged and judges nothing, no live engine or a factor of 1 is a skip, and a hammer wave reads no soldier.
# terror: written when the wave clears (or the run ends in it) as power=terror w=<N> pulses= drained= lost= pushed_below= max_ms= budget_ms=16 floor=; it fails when any pulse left a defender below the floor (pushed_below above 0) or the slowest took 16 ms or more,
# and skips when the wave had no pulse or none drained anyone. The [LongDefeat][Terror] pulse n= ms= lines show the first three pulses of each wave and any slow one.
# blades (Morgul Blades, Fouled Blades at Helm's Deep): written when the wave clears (or the run ends in it) as power=blades w=<N> doses= hits= damage= owner_missing= withheld=, from the run's own counts for that wave. Every hit by an attacker on a defender that the engine's
# OnScoreHit reports unblocked with some health taken doses the defender (one dose per victim, 2 health a second for 6 s at Helm's Deep, armour ignored), and each tick that would kill needs a living owner: the poisoner, else the commander, else any attacker standing,
# else the tick is withheld and the victim keeps 1 health. owner_missing counts an owner found not active at the call and kills nothing; the line fails above 0 (run_long_defeat.py also fails any owner_missing= token in the log and the report's poison.ownerMissing).
# The line skips when no hit landed (reason=no-hit) or no dose took a point of health (reason=no-damage); [LongDefeat][Blades] tick lines show the first three ticks of a wave and any that killed, were withheld or went to a substitute owner.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.boon"
needs = "a boon pick owed at the third cleared wave and taken in the intermission after it (--waves 5 --garrison-scale 1.5 --seed N)"
reached = ['\[Check\] id=taom\.long-defeat\.boon result=']
pass = ['\[Check\] id=taom\.long-defeat\.boon result=pass p=[0-9]+ cards=[0-9]+ eligible=[0-9]+ offered=']
fail = ['\[Check\] id=taom\.long-defeat\.boon result=fail']
# Written by LongDefeatDirector.Boons.cs when a boon is taken, key p=<N>: the last draw showed as many cards as it could (three, or all that were eligible), none twice, the taken boon was among them,
# and the numbers it changes read back as the shipped ones changed by every boon owned (garrison cap, intermission, rest share, keep hold, pack bonus, the four gold factors, the gold paid at the pick).
# A troop or class boon with a stat or health key also ends the line with read=pass, read=skip (no soldier of its target stood) or read=fail: a soldier of the target, read right after the refresh,
# holds its health limit at the combined factor and each driven property at its baseline changed by the summed percent. The first pack of that group spawned after the pick is read the same way
# and written as its own line of this check (key p<N>-<group>, read=spawned), which the pass pattern leaves alone and a fail line fails.
# Seeds whose first offer holds a troop boon the bot takes (it rerolls once, then takes the first card without a drawback): --waves 5 --seed 33 (infantry health), --waves 5 --class archer --seed 22 (archers' aim error and draw speed), --waves 5 --class archer --seed 4 (the lord's draw speed), --waves 5 --seed 29 (a Cavalry run: the bot's draw from seed 29 is cavalry and its first pick is Gallop of the Eorlingas, a player move speed boon, so the read-back samples the lord and his horse). The pass only proves the horse when the lord still had one at the pick: read the `[Check] ... boon ... read=standing target=player` line and confirm a MountSpeed part is on it, because the read-back drops the horse expectation when none stood and still writes read=pass (the horse can die in waves 1 to 3, and with no sally block nothing remounts him). Slice 7 added a Legend row, which moved every draw, and Slice 11 added a fourth class, which moved every unarmed seed's class draw from Below(3) to Below(4), so these seeds are not Slice 6's: seed 4 now needs --class archer. With all eight affixes rolling (Slice 9) their wave 5 is blades (seeds 33 and 4) and lash (seeds 22 and 29): the first two also write a blades line.
# The unattended bot buys the first offer of the slot it wants (militia or yeomen), so no rider ever stands in its run, and the mounted lord is the player record, never a cavalry soldier: a cavalry troop boon reads skip with reason=no-soldier even in a Cavalry run (seed 19 draws cavalry and takes Fleet Horses of the Mark; that proves the troop row can be taken and nothing about a horse). The horse of the lord is read through the player boons of the Cavalry class (seed 29). The drums sample on a horse stays unbuilt: the attackers spawn on foot.
# The unattended bot takes a pick at the start of the intermission after the third clear, so a session that stopped at or before that clear reads NOT REACHED.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.reroll"
needs = "a banked reroll at the first pick (the wrapper arms start_rerolls=1, so --waves 5 spends it at clear 3)"
reached = ['\[Check\] id=taom\.long-defeat\.reroll result=']
pass = ['\[Check\] id=taom\.long-defeat\.reroll result=pass p=[0-9]+ draw=[0-9]+ bank=[0-9]+>[0-9]+ ']
fail = ['\[Check\] id=taom\.long-defeat\.reroll result=fail']
# Written by LongDefeatDirector.Boons.cs when a reroll is spent, key p=<N>: the bank fell by one, three new cards (or all that were eligible) none twice, and none of the cards just shown while three or more others were eligible.
# The unattended bot spends the first reroll it ever holds on the first offer; a session that banked none reads NOT REACHED.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.class"
needs = "a run with a class (every run has one: --class archer --waves 2, --class cavalry --waves 3 for the mounted class, or --class all --runs 4 for all four)"
reached = ['\[Check\] id=taom\.long-defeat\.boot result=pass', 'LongDefeatConfigCatalog: classes\.json: ']
pass = ['\[Check\] id=taom\.long-defeat\.class result=pass class=\S+ mounted=(true|false) ']
fail = ['\[Check\] id=taom\.long-defeat\.class result=fail']
# Written by LongDefeatDirector.Player.cs after each spawn of the lord, key <mission> at the start and <mission>-d<N> at a respawn: the kit's slots read back from his spawn equipment (an empty slot reads back empty), the horse
# slots cleared and no mount for a foot class, a horse under him (has_mount=true) and the kit's horse and harness read back for the mounted class (Cavalry), no slot the engine refused (an unknown item, one that does not fit), and no fall back to his own gear. A booted run of a build that read classes.json (every read writes a LongDefeatConfigCatalog line, so a build from before Slice 5 never matches the second reached pattern and reads NOT REACHED) whose lord spawned with no class line is a FAIL.
absence = "fail"

[[check]]
id = "taom.long-defeat.commander"
needs = "a wave that brings a commander (--waves 5 --garrison-scale 1.5 for the wave 4 captain; --start-wave 8 --waves 1 for the lieutenant)"
reached = ['\[Check\] id=taom\.long-defeat\.commander result=']
pass = ['\[Check\] id=taom\.long-defeat\.commander result=pass w=[0-9]+ troop=\S+ rank=\S+ steps=[0-9]+ ']
fail = ['\[Check\] id=taom\.long-defeat\.commander result=fail']
# Written by LongDefeatDirector.Commander.cs when the wave clears, key w<N>: the troop, rank and steps are the plan's for that wave (CommanderPlan.ForWave), he ended (killed, felled or left, never standing), no ability fired after his end
# (uses_after_end counted against the uses at the moment he ended), each ability that was due while he stood (first delay plus 2 s) fired at least once, and his health limit over his character's maximum, read right after he spawned, is the rank's factor times the wave's endless
# factor within 1% (health_x against expected_x). A commander the engine could not spawn is reported left with health_x=unread and fails. Risk 1 (does a hero spawned mid-wave fight as a soldier) is read from the
# [LongDefeat][Commander] w<N> lines every 5 s (position, health, formation and behavior); risk 10 (does the bot reach wave 4 with commanders in play) by the run itself.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.summon"
needs = "a commander with a summon ability that stood past 30 s of his wave (--start-wave 8 --waves 1: the lieutenant)"
reached = ['\[Check\] id=taom\.long-defeat\.summon result=']
pass = ['\[Check\] id=taom\.long-defeat\.summon result=pass w=[0-9]+ s=[0-9]+ queued=[0-9]+ ']
fail = ['\[Check\] id=taom\.long-defeat\.summon result=fail']
# Written by LongDefeatDirector.Commander.cs when the wave clears, one line per summon, key w<N>s<k>: the summon queued the count the plan gives that ability for that wave (expected=) and every queued soldier was sent to the field
# before the clear (spawned=). fired_at, spawned_at and wave_seconds are wave seconds, so risk 16 (do the summons arrive in time) reads off the line. A run that ends before the soldiers all came writes a skip line, which reads NOT REACHED.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.sally"
needs = "a Cavalry run (--class cavalry --waves 3) on a fortress whose fortresses.json row has a recorded sally block. With no block, as at Slice 11, each wave writes a skip with reason=no-sally-point (the lord rides from Begin) and run_long_defeat.py accepts that skip, for that reason alone, in place of the pass"
reached = ['\[Check\] id=taom\.long-defeat\.sally result=']
pass = ['\[Check\] id=taom\.long-defeat\.sally result=pass w=[0-9]+ how=(teleport|remount) mount=yes ']
fail = ['\[Check\] id=taom\.long-defeat\.sally result=fail']
# Written by LongDefeatDirector.Sally.cs at each wave's start, key w<N>, from the lord read right after the move: he stands within 2 m of the sally point on the ground with a horse under him, no player death was counted by
# the move (deaths=a->b), and for a remount (he was on foot: his horse died, or he was knocked off or dismounted) the step was done and the old body was not reported killed or knocked out (old_state, old_lost). Native reports the faded body Routed inside FadeOut,
# before the new body spawns, so a later killed or knocked-out report is not expected; if one came it would write a second line for the wave, result=fail. A skip says why no sally was made (reason=no-sally-point, point-unusable, taken-over or no-lord). The same wave writes [LongDefeat][Sally] w<N> out: teleport|remount with the
# formation and its order position (risk 3: a formation that drags the rider home against a camera or horse fault), mount=yes (risk 8 is closed from source: a null mount key builds the horse with a random coat, so mount= reads the horse, not the key), the old body's state and every removal and deletion callback for it.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.sally-return"
needs = "the same run, a wave cleared after a sally. With no sally block each clear writes a skip with reason=no-sally-point, which the judge accepts in place of the pass only while the sally check reads the same"
reached = ['\[Check\] id=taom\.long-defeat\.sally-return result=']
pass = ['\[Check\] id=taom\.long-defeat\.sally-return result=pass w=[0-9]+ dist=']
fail = ['\[Check\] id=taom\.long-defeat\.sally-return result=fail']
# Written by LongDefeatDirector.Sally.cs at each clear of a wave the lord sallied in, key w<N>: after the teleport home he stands within the keep radius of the home point (the recorded foot muster, else the keep) and no player death was counted since he went out. A skip names why
# he was not brought home (no-lord, taken-over: his body is a soldier's now, point-unusable: the home point failed its check). With no sally block (Slice 11) the clear also writes a skip, reason=no-sally-point, for the run that rides from Begin, so no sally was made to return from.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.sally-contact"
needs = "the same run, with attackers near the sally point in the wave's first 180 s"
reached = ['\[Check\] id=taom\.long-defeat\.sally-contact result=']
pass = ['\[Check\] id=taom\.long-defeat\.sally-contact result=pass w=[0-9]+ t=']
fail = ['\[Check\] id=taom\.long-defeat\.sally-contact result=fail']
# Written by LongDefeatDirector.Sally.cs, key w<N>: pass at the first hit in the wave's first 180 s, within 40 m of the sally point, by or on the lord or his horse (hits_given, hits_taken, mount_hits and kills are in the line, the horse's in its own field). A wave with
# none writes a skip (reason=none-in-180s, none-before-clear), never a fail: the judge reports this check and does not require it. While he is more than 20 m outside the keep, a [LongDefeat][Sally] w<N> t=<s> line every 5 s carries the counts, nearest_attacker,
# to_formation, gate and outside_boundary seconds (MissionBoundaryCrossingHandler retreats the mission after 10 s, which ends the run).
absence = "not-reached"

[[human]]
claim = "the Cavalry ride outside the walls: the rider goes out at each wave's start and comes home at each clear with the camera, the horse and his formation behaving; the attackers react to him (Fell Foes makes up to 8 attacker archers within 20 m hold the rider as their target, so judge the infantry too); and the return feels right"

[[human]]
claim = "the commander is visible among the attackers, fights as a soldier and falls like one, and the HUD names his rank and next ability"

[[human]]
claim = "how the walls look under attack (the gate state, the machines, the attackers climbing)"

[[human]]
claim = "orders move formations: the order bar's orders take the selected formation"

[[human]]
claim = "B opens the shop with the player held in place, and the shop feels right"

[[human]]
claim = "after the player dies, E takes a soldier"

[[human]]
claim = "the terrain looks right after Cancel on the shader dialog"

[[human]]
claim = "the prompt text reads well"

[[human]]
claim = "Tab does nothing"

[[human]]
claim = "leaving the boundary returns to the main menu"

[[human]]
claim = "Leave on the end panel returns to the main menu"

[[human]]
