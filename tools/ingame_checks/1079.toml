[[check]]
id = "taom.long-defeat.volley"
needs = "a Long Defeat run at a fortress whose fortresses.json records volley.origins (Mike records them with taom.ld_record volley; none is recorded for Helm's Deep until 2026-11-06, so without them the Elven Volley is not for sale and this row is NOT REACHED): python tools/run_long_defeat.py --waves 3 --garrison-scale 1.3 --start-gold 5000 (the bot buys level 1 in the preparation and level 2 at clear 1, and looses the volley in each wave: an auto line in wave 1 and a mode=crosshair aim=bot line in waves 2 and 3); Mike also presses N and aims (aim=person)"
reached = ['\[Check\] id=taom\.long-defeat\.volley result=']
pass = ['\[Check\] id=taom\.long-defeat\.volley result=pass w=[0-9]+ use=[0-9]+ source=elven mode=(auto|crosshair)( aim=(person|bot) ray_gap=(-?[0-9.]+|NaN))? arrows=[0-9]+ shots=[0-9]+ candidates=[0-9]+ distinct=[0-9]+ spawned=0 hits=[0-9]+ blocked=[0-9]+ friendly=0 cancelled=[0-9]+ kills=[0-9]+ affector_null=[0-9]+ affector_side=[0-9]+ owner=\S+ mult=\S+ base_speed=[0-9.]+ impact_speed=[0-9.]+ window=[0-9.]+']
fail = ['\[Check\] id=taom\.long-defeat\.volley result=fail']
# Written by LongDefeatDirector.Volley.cs, one line per use, key elven-w<N>u<k>, when the use's six-second hit window closes, the wave's clear cuts it (ended=wave) or the run ends (ended=run). A tower's level 3 volley writes the same line under taom.long-defeat.tower-volley (next row), so one source's pass never pays the other's debt.
# arrows= is the arrows asked for, shots= the shots the aim planned and candidates= the attackers in reach; distinct= must be min(shots, candidates), one attacker per arrow while they lasted. spawned=0 is the mission's agent count around the fire (a missile is no agent).
# hits= are foe hits within the window and must reach half the arrows (a first guess for Mike to tune, A16); blocked= shield and weapon blocks, on a foe or a defender, are counted apart and left out of that share (the engine never cancels a friendly block, and a block does the defender no harm); friendly= is an unblocked friendly hit the engine did NOT cancel and must be 0 (cancelled= counts the ones it did, E14, A19).
# affector_null= and affector_side= count hits whose engine affector was null or on the wrong side (an owner that died or whose slot was reused while the arrow flew, A24): reported, never judged, and a non-zero count is an UNSETTLED native case for the main session before any fix.
# owner= is the troop of the defender who owns the arrows (never the main agent, an AI-controlled archer far from the melee first, D22) and mult= his weapon damage multiplier (D25); base_speed= is the first hit's MissileStartingBaseSpeed and impact_speed= the arrow's speed at that hit (collisionData.MissileVelocity); the engine gives an arrow air drag and scales its damage by (impact speed over base speed) squared, so an impact speed well under base_speed at long range is the drag, not a tuning fault.
# mode=crosshair names who aimed it: aim=person is the lord's eye ray, aim=bot runs from his eye toward the densest group because nothing turns an AI lord's look onto the attackers; ray_gap= is the distance from the point the ray hit to the nearest attacker in reach.
# A window cut short before the share was met is a skip (reason=window-cut) and proves nothing; a skip never pays this row. The check is owed once a volley level was bought before a wave the run then played, whether or not the report shows a use.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.tower-volley"
needs = "a Long Defeat run at a fortress whose fortresses.json records a tower's tower_volley spots as well as its posts (Mike records them with taom.ld_record tower_volley <tower> and post <tower>; none is recorded for Helm's Deep until 2026-11-06, so without them tower level 3 is not for sale and this row is NOT REACHED): python tools/run_long_defeat.py --waves 3 --garrison-scale 1.3 --start-gold 5000 (the bot buys tower level 3 at clear 2 and each tower with a spot and a post archer looses its volley in wave 3: a source=tower-<id> line for each such tower)"
reached = ['\[Check\] id=taom\.long-defeat\.tower-volley result=']
pass = ['\[Check\] id=taom\.long-defeat\.tower-volley result=pass w=[0-9]+ use=[0-9]+ source=tower-[a-z_]+ mode=auto arrows=[0-9]+ shots=[0-9]+ candidates=[0-9]+ distinct=[0-9]+ spawned=0 hits=[0-9]+ blocked=[0-9]+ friendly=0 cancelled=[0-9]+ kills=[0-9]+ affector_null=[0-9]+ affector_side=[0-9]+ owner=\S+ mult=\S+ base_speed=[0-9.]+ impact_speed=[0-9.]+ window=[0-9.]+']
fail = ['\[Check\] id=taom\.long-defeat\.tower-volley result=fail']
# Written by LongDefeatDirector.Volley.cs, one line per tower use, key tower-<id>-w<N>u<k>, with the same detail as the Elven Volley's volley line (see that row for every field) and source=tower-<id> in place of elven. A tower looses from its own tower_volley spots with the tower's arrow
# (ld_tower_arrow, the Fords arrow's twin that cannot be picked up) at the densest group in reach (mode=auto always), owned by one of that tower's live post archers (owner= names his troop); a tower with no post archer standing is withheld for NoOwner and stops for the wave, which writes no line. Each use has its own six-second window, and a hit is
# given to the window whose fire loosed the missile that struck, so two towers firing in one tick keep their own counts. The pass pattern is tied to the C# detail by LongDefeatDirectorTowerVolleyTests (the real log sanitiser against this pattern). The judge owes one pass for each recorded tower that holds a volley spot and a post,
# once tower level 3 was bought before a wave the run played; a skip (reason=window-cut) proves nothing. hits= must reach half the arrows (A16: a first guess for Mike to tune).
absence = "not-reached"

[[check]]
id = "taom.long-defeat.posts"
needs = "a Long Defeat run at a fortress whose fortresses.json records tower posts (Mike records them with taom.ld_record post <tower>; none is recorded for Helm's Deep until 2026-11-06, so without them the tower row is not for sale and this row is NOT REACHED): python tools/run_long_defeat.py --waves 2 --garrison-scale 1.3 --start-gold 5000, once per hold variant (--posts-variant A, B and C; the bot buys tower level 1 in the preparation and level 2 at clear 1)"
reached = ['\[Check\] id=taom\.long-defeat\.posts result=']
pass = ['\[Check\] id=taom\.long-defeat\.posts result=pass tower=[a-z_]+ w=[0-9]+ level=[12] variant=[ABC] formation=[0-9]+ posts=[0-9]+ expected=[1-9][0-9]* manned=[0-9]+ held=([0-9]+) sampled=\1 max_drift=[0-9.]+ max_dz=[0-9.]+ shots=[1-9][0-9]* split=[0-9]+ out=[0-9]+ short=[0-9]+ failed=0']
fail = ['\[Check\] id=taom\.long-defeat\.posts result=fail']
# Written by LongDefeatDirector.Posts.cs, one line per tower and wave, key <tower>-w<N>, at the wave's clear, or with ended=run when the run ends first (Slice 7, spike S6). manned= is the archers standing on the tower as the wave began and expected= the posts the fill should
# have filled (the level's posts less short=, the posts the garrison cap left empty: named, never failed; a spawn that threw is failed=N, kept in expected= so it fails the line, and a pass needs failed=0); held=H sampled=N is the sample taken 30 s into the wave, H archers of the N still standing within 1.5 m and 2 m of their own posts (max_drift= and max_dz= are the worst of them),
# and it must read the same number twice (every word of the detail is name=value: the game's log sanitiser glues a bare word to the value before it, so "held=4 of 4" would be logged as held=4_of_4 and never match); shots= is the arrows the tower's archers loosed by the clear (the engine's OnAgentShootMissile), at least one, which settles A18: a held archer still shoots. split= counts post archers the once-a-second re-assert (D30a) moved back into the posts formation
# after the tactic took them away and out= agents it moved out of it; variant= names how the archers were held (A a scripted position, B with a speed limit of 0, C with the formation set not splittable by AI) and formation= the posts formation's index (4, the A23 boot lines).
# A skip proves nothing and is named: reason=short-wave (the wave ended before the 30 s sample), none-standing (no archer left at the sample), no-archers (the fill left nothing to prove) or window-cut (the run ended before any arrow). A skip never pays this row.
absence = "not-reached"

[[check]]
id = "taom.long-defeat.split"
needs = "a Long Defeat run at a fortress whose fortresses.json row has a split block (Helm's Deep has one from 2026-11-12) that reaches the first contact of a wave: python tools/run_long_defeat.py --waves 2"
reached = ['\[Check\] id=taom\.long-defeat\.split result=']
pass = ['\[Check\] id=taom\.long-defeat\.split result=pass w=[0-9]+ ']
fail = ['\[Check\] id=taom\.long-defeat\.split result=fail']
# Written by LongDefeatDirector.Split.cs, key w<N> for the wave the split stood before, when the hold ends at the first contact (a siege lane rose above its defense level at the hold, SiegeLane.GetDefenseState).
# Each group the split made is <name>=<count> <name>_median=<m> <name>_high=<count at or above the wall line>, for wall, gate, low and high; then held_s= released= kept= lanes=. A pass needs every group to hold soldiers and its median ground
# distance to its place within 25 m for the infantry and 40 m for the archers (Scatter spreads them over the archer points within 40 m). The [LongDefeat][Split] lines name each group's place and size at each split and at each wave start.
# A skip proves nothing and is named: reason=short-hold (the hold lasted under 20 s), engine-took (no group was still off AI control at the release), charge (the stalemate charge ended the hold), no-contact (the wave cleared first), run-ended or no-groups. run_long_defeat.py owes one pass once the log shows a split was made and a wave cleared. A fail with reason=no-places means the scene gave no place for a pair, and the defenders stayed with the AI.
absence = "not-reached"

