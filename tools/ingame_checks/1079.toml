fail = ['\[Check\] id=taom\.long-defeat\.gate-repair result=fail']
# Written by LongDefeatDirector.Gates.cs, key w<N> (the wave the repair precedes), on the tick after the buy (D17): the one repair path (the maximum written, then vanilla's CastleGate.OnMissionReset by reflection, then SetAutoOpenState(false)) left every gate it acted on
# standing, enabled, with State Closed and not open, its hit points at the levelled maximum (vanilla times the level's factor within 1%) and its damage-state index 0, and the hidden gate the boot broke still broken (hidden_down=true). path=broken when any repaired gate was destroyed, else damaged.
# With two or more visible gates every number is keyed g0., g1. and so on, which the patterns accept. near= counts the defenders within 4 m of the gate (R3: a soldier in the gateway when it closes may be caught in the door, so read it before treating a stuck soldier as a bug). reset=missing means the reflection found nothing (R10).
absence = "not-reached"

