# In-game checks for #967 C2 and C3, read by tools/ingame_verdict.py. The line is written by the authority: on a
# dedicated server, run the reader with --ds-engine <stage>\engine; an in-process server writes it to the taom log.
# Written by Main/Features/CoopInterop/Hooks/CoopUpgradeChargePatch.cs when a player's upgrade is charged.
# NOT REACHED is the normal result without a co-op session, or with Elite Troops Cost Gold Only on at the server.
# C3 checks are NOT REACHED on any build before the C3 commit.
issue = 967
title = "Co-op: a player's troop upgrade charges upgrade_cost on the server (C2); TAOM.CoopCompat build and settings handshake and War of the Ring relay (C3)"
fixed_in = "fc7cd73c4"   # trunk on origin before the patch: the manifest ships with the emitter
logs = ["taom-ds", "taom"]

[[check]]
id = "taom.coop.upgrade-charge"
needs = "a co-op session on a dedicated server: as a guest with enough special resource, upgrade a troop into an elite that has an upgrade_cost, then press Done on the party screen"
reached = ['\[Check\] id=taom\.coop\.upgrade-charge result=(pass|fail) ']
pass = ['\[Check\] id=taom\.coop\.upgrade-charge result=pass hero=\S+ charged=[\d.]+$']
fail = ['\[Check\] id=taom\.coop\.upgrade-charge result=fail ']
absence = "not-reached"

[[human]]
claim = "after the guest leaves and joins again, the guest's balance is lower by the upgrade_cost of the upgrade"

# C3: the TAOM.CoopCompat module (CoopCompat/Handshake/SettingsHandshakeService.cs and
# CoopCompat/Momentum/MomentumRelayService.cs). Its lines go to the taom log through TAOM's IOutcomeLog.
# NOT REACHED is the normal result without TAOM.CoopCompat in the module list of every peer.
[[check]]
id = "taom.coopcompat.settings.server"
needs = "a co-op session with TAOM.CoopCompat on the server and a client: the client joins and loads the campaign"
reached = ['\[Check\] id=taom\.coopcompat\.settings\.server result=(pass|fail) ']
pass = ['\[Check\] id=taom\.coopcompat\.settings\.server result=pass verdict=(match|differ|inconclusive) groups=\d+ build_mismatch=(true|false)$']
fail = ['\[Check\] id=taom\.coopcompat\.settings\.server result=fail ']
absence = "not-reached"

[[check]]
id = "taom.coopcompat.settings.client"
needs = "the same join, read from the client's taom log: a pass means the client and the server run the same TAOM build"
reached = ['\[Check\] id=taom\.coopcompat\.settings\.client result=(pass|fail) ']
pass = ['\[Check\] id=taom\.coopcompat\.settings\.client result=pass verdict=(match|differ|inconclusive) groups=\d+ build_mismatch=false$']
fail = ['\[Check\] id=taom\.coopcompat\.settings\.client result=fail ']
absence = "not-reached"

[[check]]
id = "taom.coopcompat.momentum.server"
needs = "the same join: the server sends the joining client the War of the Ring state"
reached = ['\[Check\] id=taom\.coopcompat\.momentum\.server result=(pass|fail) ']
pass = ['\[Check\] id=taom\.coopcompat\.momentum\.server result=pass sequence=\d+ entries=\d+$']
fail = ['\[Check\] id=taom\.coopcompat\.momentum\.server result=fail ']
absence = "not-reached"

[[check]]
id = "taom.coopcompat.momentum.client"
needs = "the same session, read from the client's taom log: the client applies the server's War of the Ring state"
reached = ['\[Check\] id=taom\.coopcompat\.momentum\.client result=(pass|fail) ']
pass = ['\[Check\] id=taom\.coopcompat\.momentum\.client result=pass sequence=\d+ entries=\d+$']
fail = ['\[Check\] id=taom\.coopcompat\.momentum\.client result=fail ']
absence = "not-reached"

[[human]]
claim = "with a TAOM setting changed on the client only, the client shows the settings notice on join and names that setting's group"

[[human]]
claim = "after the server's War of the Ring momentum changes (a settlement captured), the client's War of the Ring screen shows the same value within about a minute"
