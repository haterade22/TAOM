# In-game checks for #1104, read by tools/ingame_verdict.py.
# Written by Main/Features/SupplyLines/Hooks/SupplyCaravanEncounterPatch.cs when the player meets a supply caravan.
# Delivery fires at 1.2 map units and runs before the encounter check each frame. The meeting radius is
# Max(0.5, dt * 10), so a single player with the feature on writes this line only on a large frame step.
# NOT REACHED is the normal result in that case.
issue = 1104
title = "Supply Lines: clicking a caravan ends the encounter inside PlayerEncounter.Init"
fixed_in = "d1572fcc1"   # trunk before the fix: the manifest ships with the emitter
logs = ["taom"]

[[check]]
id = "taom.supply-lines.caravan-meeting"
needs = "a meeting with a supply caravan: with an order in transit, turn Supply Lines off in MCM and click the caravan (a co-op guest who clicks the host's caravan also reaches it)"
reached = ['\[Check\] id=taom\.supply-lines\.caravan-meeting result=(pass|fail) ']
pass = ['\[Check\] id=taom\.supply-lines\.caravan-meeting result=pass party=\S+$']
fail = ['\[Check\] id=taom\.supply-lines\.caravan-meeting result=fail ']
absence = "not-reached"

[[human]]
claim = "with Supply Lines off in MCM and an order in transit, clicking the caravan shows a menu with the caravan line, a background and Leave; Leave returns to the map; with Supply Lines back on, the order still delivers"
