scope = '\[LongDefeat\] launching \S+ for fortress '
scope_end = '\[(LongDefeat|StoryMissions)\] launching '
needs = "a Long Defeat run in which Legolas casts Many Arrows (5 enemies within 40 m) and shoots during it"
reached = ['\[Check\] id=taom\.hero-abilities\.multishot result=(pass|fail)']
pass = ['\[Check\] id=taom\.hero-abilities\.multishot result=pass hero=\S+ item=1 windows=[1-9][0-9]* window_shots=[0-9]+ fired=[0-9]+ no_target=[0-9]+ out_of_range=[0-9]+ hits=[1-9][0-9]*$']
fail = ['\[Check\] id=taom\.hero-abilities\.multishot result=fail', '\[HeroAbilities\] ranged kit disabled for this mission after ', '\[HeroAbilities\] disabled for this mission after ']
absence = "not-reached"

[[check]]
id = "taom.hero-abilities.arrow-kill"
scope = '\[LongDefeat\] launching \S+ for fortress '
scope_end = '\[(LongDefeat|StoryMissions)\] launching '
needs = "a Long Defeat run in which Legolas's arrows land on enough human soldiers for a kill roll to win (50 rolls to judge a miss)"
reached = ['\[Check\] id=taom\.hero-abilities\.arrow-kill result=(pass|fail)']
pass = ['\[Check\] id=taom\.hero-abilities\.arrow-kill result=pass hero=\S+ body_hits=[0-9]+ head=[0-9]+ exempt=[0-9]+ dead_shooter=[0-9]+ calls=[0-9]+ kills=[1-9][0-9]*$']
fail = ['\[Check\] id=taom\.hero-abilities\.arrow-kill result=fail', '\[HeroAbilities\] ranged kit disabled for this mission after ', '\[HeroAbilities\] disabled for this mission after ']
absence = "not-reached"

[[check]]
id = "taom.signature-strikes.instant-kill"
scope = '\[LongDefeat\] launching \S+ for fortress '
scope_end = '\[(LongDefeat|StoryMissions)\] launching '
needs = "a Long Defeat run with an arrow of Legolas's on an unshielded human soldier whose kill roll wins"
reached = ['\[Check\] id=taom\.signature-strikes\.instant-kill result=(pass|fail) signature=taom_hero_legolas_arrow ']
pass = ['\[Check\] id=taom\.signature-strikes\.instant-kill result=pass signature=taom_hero_legolas_arrow victim=\S+ chance=[0-9.]+ roll=[0-9.]+ health=[0-9]+ damage=[0-9]+ died=1$']
fail = ['\[Check\] id=taom\.signature-strikes\.instant-kill result=fail signature=taom_hero_legolas_arrow ']
absence = "not-reached"

[[human]]
claim = "when Legolas casts Rapid Fire or Archer's Eye, he shouts, sparks burst at his chest, and he wears a pale blue outline while it runs; during Rapid Fire he draws and looses visibly faster"

[[human]]
claim = "during Many Arrows two more arrows leave his bow with each shot and fly at soldiers near his target; they look like his own arrows"

[[human]]
claim = "his arrows often break or pass an enemy shield; the archers within 15 m of him shoot faster while Archer's Eye runs"
