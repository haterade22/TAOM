reached = ['\[Check\] id=taom\.hero-abilities\.pierce result=(pass|fail)']
pass = ['\[Check\] id=taom\.hero-abilities\.pierce result=pass hero=\S+ shield_hits=[0-9]+ passed=[1-9][0-9]* broken=[0-9]+$']
fail = ['\[Check\] id=taom\.hero-abilities\.pierce result=fail', '\[HeroAbilities\] ranged kit disabled for this mission after ', '\[HeroAbilities\] disabled for this mission after ']
absence = "not-reached"

[[check]]
