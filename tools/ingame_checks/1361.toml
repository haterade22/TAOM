reached = ['\[Check\] id=taom\.hero-abilities\.hits result=(pass|fail)']
pass = ['\[Check\] id=taom\.hero-abilities\.hits result=pass hero=\S+ shots=[0-9]+ contact=[0-9]+ share=[0-9.]+ shield=[0-9]+$']
fail = ['\[Check\] id=taom\.hero-abilities\.hits result=fail', '\[HeroAbilities\] ranged kit disabled for this mission after ', '\[HeroAbilities\] disabled for this mission after ']
absence = "not-reached"

[[check]]
id = "taom.hero-abilities.pierce"
