schema_version: "1.1"
name: route-native-crash
description: A native access violation goes to the native triage
tags: [routing]
plugins: ["../.."]
execution:
  max_turns: 6
  timeout_seconds: 120
  allowed_tools: [Skill]
  append_system_prompt: "@@CLAUDE_SKILLS_TABLE@@"
  prompt: >-
    Bannerlord just closed to the desktop with no managed stack. Event Viewer shows an access
    violation in TaleWorlds.Native.dll. Find the cause.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?native-crash-triage"'
