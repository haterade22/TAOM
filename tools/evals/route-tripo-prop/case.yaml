schema_version: "1.1"
name: route-tripo-prop
description: A Tripo FBX to a map icon, with the go-ahead given
tags: [routing]
plugins: ["../.."]
execution:
  max_turns: 6
  timeout_seconds: 120
  allowed_tools: [Skill]
  append_system_prompt: "@@CLAUDE_SKILLS_TABLE@@"
  prompt: >-
    Here is a Tripo AI FBX of a watchtower at E:/LOTRAOMAssets/watchtower.fbx. Go ahead and make
    it a map icon.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?prep-tripo-prop"'
