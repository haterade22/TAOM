schema_version: "1.1"
name: route-harness-retro
description: The session start banner asks for a harness retro
tags: [routing]
plugins: ["../.."]
execution:
  max_turns: 6
  timeout_seconds: 120
  allowed_tools: [Skill]
  append_system_prompt: "@@CLAUDE_SKILLS_TABLE@@"
  prompt: Session start printed the HARNESS RETRO DUE banner. Deal with it.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?harness-retro"'
