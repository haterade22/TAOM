# TAOM — Codex acts as independent reviewer/verifier
model = "gpt-5.6-sol"
model_reasoning_effort = "max"
project_doc_max_bytes = 65536

sandbox_mode = "workspace-write"
approval_policy = "on-failure"

[shell_environment_policy]
inherit = "all"

[mcp_servers.filesystem]
command = "npx"
args = [
  "-y",
  "@modelcontextprotocol/server-filesystem",
  "E:\\repos\\TAOM",
  "E:\\Steam\\steamapps\\common\\Mount & Blade II Bannerlord\\Modules\\SandBox\\ModuleData",
  "E:\\Steam\\steamapps\\common\\Mount & Blade II Bannerlord\\Modules\\SandBoxCore\\ModuleData",
  "E:\\Steam\\steamapps\\common\\Mount & Blade II Bannerlord\\Modules\\TAOM_Map\\ModuleData",
  "E:\\Steam\\steamapps\\common\\Mount & Blade II Bannerlord\\Modules\\LOTRLOME_Armory\\ModuleData",
  "E:\\Decompiled_Bannerlord"
]

[mcp_servers.git]
command = "uvx"
args = ["mcp-server-git"]

[mcp_servers.ilspy]
command = "python"
args = ["-m", "ilspy_mcp_server.server"]

[mcp_servers.ilspy.env]
ILSPY_PATH = "ilspycmd"
